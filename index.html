      </button>
      <button class="tpl-btn" data-daymove="${i}:-1" aria-label="move up" ${i===0?"disabled style=opacity:.3":""}>▲</button>
      <button class="tpl-btn" data-daymove="${i}:1" aria-label="move down" ${i===p.days.length-1?"disabled style=opacity:.3":""}>▼</button>
    </div>`).join("") || '<div class="pad note" style="color:var(--muted)">No days yet. Add one below.</div>';

  const body = `<div class="pg-body">
      ${rows}
      <div style="padding:12px 12px 4px">
        <button class="btn btn-wide" data-dayadd="1" style="min-height:44px">+ Add a day</button>
      </div>
      <div style="padding:8px 12px 16px;display:flex;flex-direction:column;gap:10px">
        ${active ? "" : `<button class="btn btn-primary btn-wide" data-pgon="1"
          style="min-height:48px">Make this the current program</button>`}
        <button class="btn btn-wide" data-pgdup="1">Start a new program from this</button>
        <button class="btn btn-wide" data-pgname="1">Rename program</button>
        ${used || last
          ? `<div class="note" style="font-size:12.5px;color:var(--faint);line-height:1.5">
               ${last ? "This is your only program, so it stays."
                      : "Sessions are logged under this program, so it stays — deleting it would strip the day names and calendar colours off them."}</div>`
          : `<button class="btn btn-wide danger" data-pgdel="1">Delete this program</button>`}
      </div>
    </div>`;

  sheet(p.n, body, `<div class="queue-hero">
      <div class="kicker">${p.days.length} day${p.days.length===1?"":"s"}${active ? " · current" : ""}</div>
      <div class="line">${active
        ? "These are the days you can start from the Train tab."
        : "Not the current program. Its logged sessions keep their labels either way."}</div>
    </div>`);

  const back = () => openProgramSheet(p.id);

  document.querySelectorAll("[data-dayopen]").forEach(b =>
    b.onclick = () => openDaySheet(p.id, b.dataset.dayopen));

  document.querySelectorAll("[data-daymove]").forEach(b => b.onclick = () => {
    const [i, dir] = b.dataset.daymove.split(":").map(Number);
    const j = i + dir;
    if(j < 0 || j >= p.days.length) return;
    [p.days[i], p.days[j]] = [p.days[j], p.days[i]];
    save(); back();
  });

  document.querySelector("[data-dayadd]").onclick = () => askText({
    title:"New day", line:"What do you call it? Push, Legs, Chest and Back — whatever you use.",
    value:"", placeholder:"Day name", yes:"Add day",
    onYes(v){
      p.days.push({id:newId("d"), n:v, key:"U", ex:[]});
      save(); openDaySheet(p.id, p.days[p.days.length-1].id);
    },
    onNo:back,
  });

  const on = document.querySelector("[data-pgon]");
  if(on) on.onclick = () => { closeSheet(); setActiveProgram(p.id); };

  document.querySelector("[data-pgdup]").onclick = () => askText({
    title:"New program", line:"Copies " + p.n + "'s days and exercise lists, then makes it current.",
    value:p.n + " 2", yes:"Create program",
    onYes(v){ const np = duplicateProgram(p.id, v); if(np) openProgramSheet(np.id); },
    onNo:back,
  });

  document.querySelector("[data-pgname]").onclick = () => askText({
    title:"Rename program", value:p.n, yes:"Save name",
    onYes(v){ p.n = v; save(); render(); openProgramSheet(p.id); },
    onNo:back,
  });

  const del = document.querySelector("[data-pgdel]");
  if(del) del.onclick = () => askConfirm({
    title:"Delete program", kicker:p.n,
    line:"Nothing has been logged under it, so nothing is lost.",
    yes:"Delete it", danger:true,
    onYes(){
      S.programs = S.programs.filter(x => x.id !== p.id);
      if(S.activeProgram === p.id){ setActiveProgram(S.programs[0].id); return; }
      save(); render();
    },
    onNo:back,
  });
}

/* One day: its name, its calendar colour, and its exercise list. */
function openDaySheet(pgId, dayId){
  const p = (S.programs || []).find(x => x.id === pgId);
  const d = p && p.days.find(x => x.id === dayId);
  if(!d) return;
  const list = d.ex || (d.ex = []);
  const used = dayUsed(d.id);
  const back = () => openDaySheet(pgId, dayId);

  const body = `<div class="pg-body">
      <div style="padding:10px 12px 4px">
        <div class="step-label" style="padding-bottom:7px">Calendar colour</div>
        <div class="seg">${DAY_KEYS.map(k =>
          `<button data-daykey="${k.k}" class="${d.key===k.k?"on":""}">${esc(k.n)}</button>`).join("")}</div>
      </div>
      ${list.map((id,i) => {
        const def = exById[id]; if(!def) return "";
        return `<div class="tpl-row">
          <div class="tpl-name">${esc(def.n)}<small>${esc(muscleById[def.m].n)}</small></div>
          <button class="tpl-btn" data-exmove="${i}:-1" aria-label="move up" ${i===0?"disabled style=opacity:.3":""}>▲</button>
          <button class="tpl-btn" data-exmove="${i}:1" aria-label="move down" ${i===list.length-1?"disabled style=opacity:.3":""}>▼</button>
          <button class="tpl-btn x" data-exdel="${i}" aria-label="remove">✕</button>
        </div>`;
      }).join("") || '<div class="pad note" style="color:var(--muted)">No exercises in this day yet.</div>'}
      <div style="padding:12px 12px 4px">
        <button class="btn btn-wide" data-exadd="1" style="min-height:44px">+ Add exercise</button>
      </div>
      <div style="padding:8px 12px 16px;display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-wide" data-dayname="1">Rename day</button>
        ${used || p.days.length < 2
          ? `<div class="note" style="font-size:12.5px;color:var(--faint);line-height:1.5">
               ${p.days.length < 2 ? "A program needs at least one day."
                 : "Sessions are logged as " + esc(d.n) + ", so it stays — removing it would strip their name and colour."}</div>`
          : `<button class="btn btn-wide danger" data-dayrm="1">Remove this day</button>`}
      </div>
    </div>`;

  /* one level down from the program, so the dismiss goes back rather than out */
  sheet(d.n, body, `<div class="queue-hero">
      <div class="kicker">${esc(p.n)}</div>
      <div class="line">${list.length} exercise${list.length===1?"":"s"}${used ? " · logged" : ""}</div>
    </div>`, {dismissLabel:"Back", onDismiss(){ openProgramSheet(pgId); }});

  document.querySelectorAll("[data-daykey]").forEach(b => b.onclick = () => {
    d.key = b.dataset.daykey; save(); back();
  });
  document.querySelectorAll("[data-exmove]").forEach(b => b.onclick = () => {
    const [i, dir] = b.dataset.exmove.split(":").map(Number);
    const j = i + dir;
    if(j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    save(); back();
  });
  document.querySelectorAll("[data-exdel]").forEach(b => b.onclick = () => {
    list.splice(+b.dataset.exdel, 1); save(); back();
  });
  document.querySelector("[data-exadd]").onclick = () => openCatalogue(id => {
    if(!list.includes(id)) list.push(id);
    save(); back();
  }, "Add to " + d.n, {onDismiss:back});

  document.querySelector("[data-dayname]").onclick = () => askText({
    title:"Rename day", value:d.n, yes:"Save name",
    onYes(v){
      d.n = v;
      /* sessions snapshot the name at the time, so old ones keep what they said */
      save(); back();
    },
    onNo:back,

  const rm = document.querySelector("[data-dayrm]");
  if(rm) rm.onclick = () => askConfirm({
    title:"Remove day", kicker:d.n + " · " + p.n,
    line:"Nothing has been logged as this day, so nothing is lost.",
    yes:"Remove it", danger:true,

/* a one-field sheet - window.prompt is refused in sandboxed frames too */
function askText(o){
  const body = `<div style="padding:6px 16px 16px;display:flex;flex-direction:column;gap:11px">
      <input class="txt" id="askTextIn" type="text" autocomplete="off" spellcheck="false"
        maxlength="${o.max || 40}" value="${esc(o.value || "")}"
        placeholder="${esc(o.placeholder || "")}">
      <button class="btn btn-primary btn-wide" data-asksave="1"
        style="min-height:50px">${esc(o.yes || "Save")}</button>
      <button class="btn btn-wide" data-askno="1">Cancel</button>
    </div>`;
  const back = () => { closeSheet(); if(o.onNo) o.onNo(); };
  sheet(o.title, body, o.line
    ? `<div class="queue-hero"><div class="line">${esc(o.line)}</div></div>` : "",
    {onDismiss:back});
  const el = document.getElementById("askTextIn");
  const go = () => { const v = el.value.trim(); if(!v) return; closeSheet(); o.onYes(v); };
  document.querySelector("[data-asksave]").onclick = go;
  document.querySelector("[data-askno]").onclick = back;
  el.onkeydown = ev => { if(ev.key === "Enter"){ ev.preventDefault(); go(); } };
  el.focus(); el.select();
}

/* ---------- EDIT A PAST SESSION ----------
   Deliberately not the logger: no ui.activeSession, no rest timer, no
   progression hints. A session you are fixing can never quietly absorb
   today's sets, and today's advice can never be computed from a day you
   are halfway through rewriting. save() re-fingerprints that date, so the
   Sheet mirror follows on its own. */
const sessById = date => S.sessions.find(x => x.date === date) || null;
const qq = sel => document.querySelectorAll(sel);

function editSessionBody(sess){
  const blocks = sess.entries.map(e => {
    const def = exById[e.ex] || {n:e.ex};
    return `<div class="ed-block">
      <div class="ed-head">

        <button class="tpl-btn x" data-edrmex="${e.ex}" aria-label="remove exercise">✕</button>
      </div>
      ${e.sets.map((x,i) => `<button class="ed-set" data-edset="${e.ex}:${i}">
        <span class="ed-num">${i+1}</span>
        <span class="ed-val">${setLabel(e.ex, x)}</span>
        <span class="ed-go">Edit</span>
      </button>`).join("") || `<div class="ed-empty">No sets yet.</div>`}
      <button class="ed-set" data-edeff="${e.ex}">
        <span class="ed-num">EFF</span>
        <span class="ed-val">${e.effort
          ? e.effort + " · " + esc(effortName(e.effort)) : "not rated"}</span>
        <span class="ed-go">Edit</span>

}

function openEditSession(date){
  const sess = sessById(date);
  if(!sess) return;
  const n = sess.entries.reduce((a,e) => a + e.sets.length, 0);
  sheet("Edit " + fmtDate(date), editSessionBody(sess),
    `<div class="queue-hero">
      <div class="kicker">${esc(sessName(sess))}</div>
      <div class="line">${n} set${n===1?"":"s"} logged. Tap one to change the weight or reps.</div>
    </div>`,
    {dismissLabel:"Done", onDismiss(){ closeEditSession(date); }});
  wireEditSession(date);
}

/* An entry with no sets left is clutter and an empty session is a ghost day on
   the calendar. Prune both, but only on the way out - mid-edit they are the
   scaffolding you are adding sets onto. */
function closeEditSession(date){
  const sess = sessById(date);
  if(sess){
    sess.entries = sess.entries.filter(e => e.sets.length);
    if(!sess.entries.length){
      S.sessions = S.sessions.filter(x => x !== sess);
      if(ui.calDay === date) ui.calDay = null;
    }
    save();
  }
  closeSheet(); render();
}

function wireEditSession(date){
  qq("[data-edset]").forEach(b => b.onclick = () => {
    const p = b.dataset.edset.split(":");
    openSetEditor(date, p[0], +p[1]);
  });
  qq("[data-edaddset]").forEach(b => b.onclick = () => openSetEditor(date, b.dataset.edaddset, -1));
  qq("[data-edeff]").forEach(b => b.onclick = () => openEffortSheet(date, b.dataset.edeff));

  qq("[data-edrmex]").forEach(b => b.onclick = () => {
    const sess = sessById(date); if(!sess) return;
    const id = b.dataset.edrmex;
    const e = sess.entries.find(x => x.ex === id); if(!e) return;
    askConfirm({
      title:"Remove exercise",
      kicker:(exById[id] || {n:id}).n + " · " + fmtDate(date),
      line:e.sets.length + " set" + (e.sets.length===1?"":"s") + " will go with it.",
      yes:"Remove", danger:true,
      onYes(){
        sess.entries = sess.entries.filter(x => x.ex !== id);
        save(); openEditSession(date);
      },
      onNo(){ openEditSession(date); }
    });
  });

  const add = document.querySelector("[data-edaddex]");
  if(add) add.onclick = () => openCatalogue(id => {
    const sess = sessById(date); if(!sess) return;
    if(!sess.entries.some(e => e.ex === id)) sess.entries.push({ex:id, sets:[]});
    save(); openSetEditor(date, id, -1);
  }, "Add to " + fmtDate(date), {onDismiss(){ openEditSession(date); }});
}

/* Rate, or fix a rating, on a session already logged. Same picker as the
   Log it? sheet, so there is one place the scale is defined. */
function openEffortSheet(date, exId){
  const sess = sessById(date); if(!sess) return;
  const e = sess.entries.find(x => x.ex === exId); if(!e) return;
  const back = () => openEditSession(date);

  let sel = e.effort;
  const body = `<div style="padding:8px 16px 16px;display:flex;flex-direction:column;gap:11px">
      ${effortPickerHTML(sel, "Rate Your Effort")}
      <button class="btn btn-primary btn-wide" data-effsave="1" style="min-height:50px">Save</button>
      <button class="btn btn-wide" data-effclear="1">Clear the rating</button>
      <button class="btn btn-wide" data-effback="1">Cancel</button>
    </div>`;

  sheet((exById[exId] || {n:exId}).n, body, `<div class="queue-hero">
      <div class="kicker">${esc(fmtDate(date))}</div>
      <div class="line">How hard was this one?</div></div>`,
    {dismissLabel:"Back", onDismiss:back});

  /* nothing is written until Save, so you can move between 7 and 8 freely */
  const repaint = v => {
    mountEffortPicker(v, "Rate Your Effort", pick);
    effortBloom(v);
  };
  function pick(v){ sel = v; repaint(sel); }

/* idx -1 means a new set, prefilled from the last one on that exercise.
   Own ids and own nudge attribute, so the logger's handlers cannot reach in. */
function openSetEditor(date, exId, idx){
  const sess = sessById(date); if(!sess) return;
  let e = sess.entries.find(x => x.ex === exId);
  if(!e){ e = {ex:exId, sets:[]}; sess.entries.push(e); }
  const def = defFor(exId), time = isTime(exId);
  const cur = idx >= 0 ? e.sets[idx] : (e.sets[e.sets.length-1] || null);
  if(idx >= 0 && !cur) return;

  const startT = cur && cur.t != null ? cur.t : 30;
  const startW = cur ? cur.w : (def.bw ? 0 : 20);
  const startR = cur ? cur.r : def.rl;
  const back = () => openEditSession(date);

  const controls = time ? `
      <div class="step-group">
        <div class="step-label">Minutes</div>
        <div class="step-ctl">
          <button data-ednudge="t:-" aria-label="fewer minutes">−</button>
          <input id="edT" type="number" inputmode="numeric" step="5" value="${startT}">
          <button data-ednudge="t:+" aria-label="more minutes">+</button>
        </div>
      </div>` : `
      <div class="step-group">
        <div class="step-label">Weight (${def.u})</div>
        <div class="step-ctl">
          <button data-ednudge="w:-" aria-label="less weight"
            ${startW <= 0 ? 'class="atfloor"' : ""}>−</button>
          <input id="edW" type="text" inputmode="decimal" autocomplete="off"
            spellcheck="false" value="${w(startW)}">
          <button data-ednudge="w:+" aria-label="more weight">+</button>
        </div>
      </div>
      <div class="step-group">
        <div class="step-label">Reps</div>
        <div class="step-ctl">
          <button data-ednudge="r:-" aria-label="fewer reps">−</button>
          <input id="edR" type="number" inputmode="numeric" step="1" value="${startR}">
          <button data-ednudge="r:+" aria-label="more reps">+</button>
        </div>
      </div>`;

  const body = `<div style="padding:6px 16px 16px;display:flex;flex-direction:column;gap:11px">
      <div class="stepper">${controls}</div>
      <button class="btn btn-primary btn-wide" data-edsave="1" style="min-height:52px">
        ${idx >= 0 ? "Save set" : "Add set"}</button>
      ${idx >= 0 ? `<button class="btn btn-wide danger" data-eddel="1">Delete set</button>` : ""}
      <button class="btn btn-wide" data-edback="1">Cancel</button>
    </div>`;

  /* exercise name alone in the title - at 375px the two together wrapped */
  sheet((exById[exId] || {n:exId}).n, body,
    `<div class="queue-hero">
      <div class="kicker">${idx >= 0 ? "Set " + (idx+1) : "New set"} · ${esc(fmtDate(date))}</div>
      <div class="line">${time ? "Logged in minutes."
        : "Target " + def.rl + "–" + def.rh + " reps."}</div>
    </div>`,
    {dismissLabel:"Back", onDismiss:back});

  qq("[data-ednudge]").forEach(b => b.onclick = () => {
    const p = b.dataset.ednudge.split(":"), f = p[0], dir = p[1];
    const el = document.getElementById(f === "w" ? "edW" : f === "r" ? "edR" : "edT");
    const step = f === "w" ? def.inc : f === "t" ? 5 : 1;
    let v = num(el.value) + (dir === "+" ? step : -step);
    if(v < 0) v = 0;
    v = Math.round(v*100)/100;
    if(f === "w"){
      el.value = w(v);
      const minus = document.querySelector('[data-ednudge="w:-"]');
      if(minus) minus.classList.toggle("atfloor", v <= 0);
    } else {
      el.value = v;
    }
  });

  document.querySelector("[data-edback]").onclick = back;

  document.querySelector("[data-edsave]").onclick = () => {
    let val;
    if(time){
      const t = Math.round(num(document.getElementById("edT").value));
      if(t <= 0) return;
      val = {t};
    } else {
      const r = Math.round(num(document.getElementById("edR").value));
      if(r <= 0) return;
      val = {w:num(document.getElementById("edW").value), r};
    }
    if(idx >= 0) e.sets[idx] = val; else e.sets.push(val);
    save(); openEditSession(date);
  };

  const del = document.querySelector("[data-eddel]");
  if(del) del.onclick = () => { e.sets.splice(idx, 1); save(); openEditSession(date); };
}

/* full catalogue — used mid-session and from Setup */
const isArchived = id => !!(exById[id] && exById[id].archived);

/* Substitute an exercise for today only. s.plan already belongs to this session,
   so editing it can never reach the day template in Setup. Sets already logged
   under the original stay in s.entries and reappear in the grid's extras row, so
   nothing you did is hidden or reattributed. Volume follows the substitute,
   because weekVolume() counts by the exercise on each entry. */
function swapExercise(fromId, toId){
  closeSheet();
  const s = workingSession();
  const from = exById[fromId], to = exById[toId];
  if(!s || !from || !to || fromId === toId) return;

  /* copy the template down onto the session before editing it */
  if(!s.plan || !s.plan.length) s.plan = dayEx(s.day).slice();
  const i = s.plan.indexOf(fromId);
  if(s.plan.includes(toId)){
    if(i > -1) s.plan.splice(i, 1);        /* already on the list - just drop the original */
  } else if(i > -1){
    s.plan[i] = toId;
  } else {
    s.plan.push(toId);
  }
  /* an entry with nothing logged in it is clutter once swapped out */
  s.entries = s.entries.filter(e => e.ex !== fromId || e.sets.length);
  ui.openEx = null;
  save(); render();
  notice("Swapped for today",
    to.n + " replaces " + from.n + " for this session only. Your templates are untouched.");
}

function openSwapSheet(fromId){
  const def = exById[fromId];
  if(!def) return;
  openCatalogue(toId => swapExercise(fromId, toId), "Swap " + def.n + " for");
}

/* Long-press, touch and mouse. A 10px move cancels it, so scrolling the grid
   never trips a swap. Returns a probe the click handler uses to stand down. */
function wireLongPress(b){
  let t = null, fired = false, x0 = 0, y0 = 0;
  const start = (x, y) => {
    x0 = x; y0 = y; fired = false;
    clearTimeout(t);
    t = setTimeout(() => {
      fired = true;
      b.classList.remove("pulse");
      openSwapSheet(b.dataset.pick);
    }, 500);
  };
  const move = (x, y) => { if(Math.abs(x - x0) > 10 || Math.abs(y - y0) > 10) clearTimeout(t); };
  const end = () => clearTimeout(t);
  b.addEventListener("touchstart", e => start(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  b.addEventListener("touchmove",  e => move(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  b.addEventListener("touchend", end);
  b.addEventListener("touchcancel", end);
  b.addEventListener("mousedown", e => start(e.clientX, e.clientY));
  b.addEventListener("mousemove", e => move(e.clientX, e.clientY));
  b.addEventListener("mouseup", end);
  b.addEventListener("mouseleave", end);
  b.addEventListener("contextmenu", e => e.preventDefault());
  return () => fired;
}

/* Which exercises fed a muscle's bar this week, split the same way the bar is.
   Same weekStart filter as weekVolume(), so the two can never disagree. */
function muscleBreakdown(mid){
  const wk = weekStart(todayISO());
  const direct = {}, indirect = {};
  for(const s of S.sessions){
    if(weekStart(s.date) !== wk) continue;
    for(const e of s.entries){
      const def = exById[e.ex];
      if(!def || !e.sets.length) continue;
      if(def.m === mid) direct[e.ex] = (direct[e.ex] || 0) + e.sets.length;
      else if((def.sec || []).includes(mid)) indirect[e.ex] = (indirect[e.ex] || 0) + e.sets.length;
    }
  }
  return {direct, indirect};
}

function openMuscleSheet(mid){
  const m = muscleById[mid];
  if(!m) return;
  const t = targetFor(mid), v = weekVolume()[mid], b = muscleBreakdown(mid);
  const sets = n => n + " set" + (n === 1 ? "" : "s");

  const row = id => {
    const def = exById[id];
    if(!def) return "";
    const n = b.direct[id] || b.indirect[id];
    return `<button class="pick" data-mex="${id}">
      <div class="pick-row">
        <div style="min-width:0">
          <b>${esc(def.n)}</b>
          <small>${esc(muscleById[def.m].n)} ${chipFor(id)}</small>
        </div>
        <div class="pick-last"><span class="chip">${sets(n)}</span></div>
      </div></button>`;
  };
  const list = o => Object.keys(o).sort((a, c) => o[c] - o[a]).map(row).join("");

  const hasD = Object.keys(b.direct).length, hasS = Object.keys(b.indirect).length;
  const body = `
    ${hasD ? `<div class="eyebrow" style="padding:13px 16px 5px">Direct · ${sets(v.direct)}</div>
      ${list(b.direct)}` : ""}
    ${hasS ? `<div class="eyebrow" style="padding:13px 16px 5px">Came along · ${sets(v.sec)}</div>

      Only the direct sets count against your ${t.lo}–${t.hi} target.${(hasD || hasS)
        ? " Tap an exercise for its history." : ""}

  sheet(m.n, body, `<div class="queue-hero">
      <div class="kicker">This week · target ${t.lo}–${t.hi}</div>
      <div class="line">${sets(v.direct)} direct${v.sec ? ", " + v.sec + " indirect" : ""}.</div></div>`);

  document.querySelectorAll("[data-mex]").forEach(btn =>
    btn.onclick = () => openHistorySheet(btn.dataset.mex));
}

function openCatalogue(onPick, title, opts){
  const o = opts || {};
  const groups = {};
  EX.filter(e => !e.archived).forEach(e => { (groups[e.m] = groups[e.m] || []).push(e); });
  const order = [...MUSCLES.map(m => m.id), "cardio"];

  const body = order.filter(mid => groups[mid]).map(mid => `
    <div class="eyebrow" style="padding:13px 16px 5px">${esc(muscleById[mid].n)}</div>
    ${groups[mid].map(e => `<button class="pick" data-cat="${e.id}">
      <div class="pick-row">
        <div style="min-width:0">
          <b>${esc(e.n)}</b>
          <small>${e.kind==="time" ? "minutes" : defFor(e.id).rl + "–" + defFor(e.id).rh + " reps"} ${chipFor(e.id)}</small>
        </div>
        <div class="pick-last">${(() => {
          const pv = exHistory(e.id).filter(h => h.date !== todayISO())[0];
          return pv ? setPills(e.id, pv.sets.slice(0,2), true) : "";
        })()}</div>
      </div></button>`).join("")}`).join("");

  const create = o.noCreate ? "" : `
    <button class="pick pick-create" data-newex="1">
      <div class="pick-row"><div><b>+ Create new exercise</b>
        <small>search 1,292 names or type your own</small></div></div>
    </button>`;

  sheet(title || "Pick an exercise", create + body, "", {onDismiss:o.onDismiss});
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    closeSheet(); onPick(b.dataset.cat);
  });
  const nb = document.querySelector("[data-newex]");
  if(nb) nb.onclick = () => { closeSheet(); openCreateSheet(onPick); };
}

function openMusclePicker(onPick, onBack, opts){
  const o = opts || {};
  const sel = new Set(o.selected || []);
  const rows = () => MUSCLES.filter(m => m.id !== o.exclude).map(m => `
    <button class="pick ${sel.has(m.id) ? "pick-on" : ""}" data-mus="${m.id}">
      <div class="pick-row">
        <div><b>${esc(m.n)}</b>
          <small>target ${targetFor(m.id).lo}–${targetFor(m.id).hi} sets a week</small></div>
        ${o.multi ? `<div class="pick-check">${sel.has(m.id) ? "✓" : ""}</div>` : ""}
      </div></button>`).join("");

  const done = o.multi ? `<div style="padding:14px 16px">
      <button class="btn btn-primary btn-wide" data-musdone="1">Done</button></div>` : "";

  const draw = () => {
    /* Back, not Close — this sheet replaced the create form and must restore it */
    sheet(o.title || "Which muscle?", rows() + done, "",
      {dismissLabel:"← Back", onDismiss:onBack || closeSheet});
    document.querySelectorAll("[data-mus]").forEach(b => b.onclick = () => {
      if(!o.multi) return onPick(b.dataset.mus);
      const id = b.dataset.mus;
      sel.has(id) ? sel.delete(id) : sel.add(id);
      draw();
    });
    const d = document.querySelector("[data-musdone]");
    if(d) d.onclick = () => onPick([...sel]);
  };
  draw();
}

const muscleName = id => (muscleById[id] || {n:id}).n;

/* enable/disable the muscle row in place, so typing never steals focus */
function syncMuscleGate(onDone){
  const mp = document.getElementById("cxMuscle");
  if(!mp) return;
  const named = !!(newEx.name || "").trim();
  /* clearing the name discards anything a prefill filled in — otherwise the old
     muscle and secondary list stick to a completely different exercise */
  if(!named && !newEx.editId && (newEx.m || newEx.sec.length || newEx.equip)){
    newEx.m = ""; newEx.sec = []; newEx.equip = "";
    renderCreate(onDone);
    const el = document.getElementById("cxName");
    if(el){ el.focus(); }
    return;
  }
  mp.disabled = !named;
  mp.classList.toggle("picker-off", !named);
  const label = mp.querySelector("span");
  if(!newEx.m) label.textContent = named ? "Choose a muscle" : "Name the exercise first";
  mp.querySelector(".picker-caret").textContent = named ? "›" : "";
  mp.onclick = named
    ? () => openMusclePicker(m => { newEx.m = m; renderCreate(onDone); }, () => renderCreate(onDone))
    : null;
}

function searchDB(q){
  const t = q.trim().toLowerCase();
  const starts = [], has = [];
  for(const r of EXDB){
    const n = r[0].toLowerCase();
    if(n.startsWith(t)) starts.push(r);
    else if(n.includes(t)) has.push(r);
    if(starts.length >= 8) break;
  }
  return starts.concat(has).slice(0, 8);
}

function renderCreate(onDone){
  const editing = !!newEx.editId;
  sheet(editing ? "Edit exercise" : "New exercise", createBody(), `<div class="queue-hero">
    <div class="kicker">${editing ? "Your exercise" : "Custom exercise"}</div>
    <div class="line">${editing
      ? "Renaming is safe — every session you have already logged stays attached to it."
      : `Search the reference list to fill this in, or just type your own name
      and set it up yourself.`}</div></div>`);
  wireCreate(onDone);
}

function wireCreate(onDone){
  const $ = id => document.getElementById(id);
  const nameEl = $("cxName");
  if(nameEl){
    nameEl.oninput = () => {
      newEx.name = nameEl.value;
      newEx.picked = false;              /* typing again re-opens the suggestions */
      syncMuscleGate(onDone);            /* unlock the muscle row as soon as it has a name */
      const box = document.querySelector(".sheet-card");
      const pos = nameEl.selectionStart;
      box.querySelector(".cx-hits") && box.querySelector(".cx-hits").remove();
      const matches = newEx.name.trim().length >= 2 ? searchDB(newEx.name) : [];
      if(matches.length){
        const div = document.createElement("div");
        div.className = "cx-hits";
        div.innerHTML = matches.map((r,i) => `<button class="cx-hit" data-hit="${i}">
          <b>${esc(r[0])}</b><small>${esc(muscleName(r[1]))} · ${esc(r[2])}</small></button>`).join("");
        nameEl.closest(".goal-row").after(div);
        div.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => {
          const r = matches[+b.dataset.hit];
          newEx.name = r[0]; newEx.m = r[1]; newEx.equip = r[2]; newEx.sec = r[3] || [];
          if(r[1] === "cardio") newEx.kind = "time";
          newEx.picked = true;           /* close the list; it would otherwise match itself */
          nameEl.blur();                 /* and drop the keyboard on a phone */
          renderCreate(onDone);
        });
      }
      nameEl.setSelectionRange(pos, pos);
    };
  }
  const mp = $("cxMuscle");
  if(mp && !mp.disabled) mp.onclick = () =>
    openMusclePicker(m => { newEx.m = m; renderCreate(onDone); }, () => renderCreate(onDone));

  const sp = $("cxSec");
  if(sp && !sp.disabled) sp.onclick = () => openMusclePicker(
    list => { newEx.sec = list; renderCreate(onDone); },
    () => renderCreate(onDone),
    {multi:true, selected:newEx.sec, exclude:newEx.m, title:"Also works"});

  document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
    newEx.kind = b.dataset.kind; renderCreate(onDone);
  });

  const bind = (id, key, fn) => { const el = $(id); if(el) el.onchange = () => { newEx[key] = fn(el.value); }; };
  bind("cxRl", "rl", v => Math.max(1, Math.round(num(v))));
  bind("cxRh", "rh", v => Math.max(1, Math.round(num(v))));
  bind("cxInc", "inc", v => Math.max(0.5, num(v)));

  const cs = document.querySelector("[data-closesheet3]");
  if(cs) cs.onclick = closeSheet;

  const sv = $("cxSave");
  if(sv) sv.onclick = () => {
    const name = (newEx.name || "").trim();
    if(!name){ notice("Needs a name", "Give the exercise a name before saving."); return; }
    if(!newEx.m){ notice("Needs a muscle", "Pick which muscle this counts toward on the Volume page."); return; }
    const clash = EX.find(e => e.n.toLowerCase() === name.toLowerCase() && e.id !== newEx.editId);
    const go = () => newEx.editId ? updateCustom(name, onDone) : saveCustom(name, onDone);
    if(clash){
      askConfirm({
        title:"Name already used",
        kicker:clash.n,
        line:"You already have an exercise with this name. Two entries with the same name split their history between them. Use the existing one instead?",
        yes:"Use the existing one",
        onYes(){ closeSheet(); if(onDone) onDone(clash.id); }
      });
      const card = document.querySelector(".sheet-card");
      const extra = document.createElement("div");
      extra.style.padding = "0 16px 16px";
      extra.innerHTML = `<button class="btn btn-wide" id="cxAnyway">Create it anyway</button>`;
      card.appendChild(extra);
      document.getElementById("cxAnyway").onclick = go;
      return;
    }
    go();
  };
}

function saveCustom(name, onDone){
  const id = "cx_" + Date.now().toString(36);
  const rec = {id, n:name, m:newEx.m, u:"lb", custom:true, sec:newEx.sec, equip:newEx.equip};
  if(newEx.kind === "time"){ rec.kind = "time"; rec.step = 5; }
  else {
    rec.rl = Math.min(newEx.rl, newEx.rh);
    rec.rh = Math.max(newEx.rl, newEx.rh);
    rec.inc = newEx.inc;
    if(newEx.kind === "bw") rec.bw = true;
  }
  S.customEx.push(rec);
  EX.push(rec); exById[id] = rec;
  save(); closeSheet();
  if(onDone) onDone(id); else render();
}

/* Write the edits back onto the record. exById holds the same object, so the
   catalogue, the day templates and every logged session follow automatically. */
function updateCustom(name, onDone){
  const id = newEx.editId;
  const rec = (S.customEx || []).find(x => x.id === id);
  if(!rec) return;
  rec.n = name;
  rec.m = newEx.m;
  rec.sec = newEx.sec;
  rec.equip = newEx.equip;
  delete rec.kind; delete rec.step; delete rec.bw;   /* Type is locked once logged */
  if(newEx.kind === "time"){ rec.kind = "time"; rec.step = 5; }
  else {
    rec.rl = Math.min(newEx.rl, newEx.rh);
    rec.rh = Math.max(newEx.rl, newEx.rh);
    rec.inc = newEx.inc;
    if(newEx.kind === "bw") rec.bw = true;
  }
  const live = exById[id];
  if(live && live !== rec){
    Object.keys(live).forEach(k => delete live[k]);
    Object.assign(live, rec);
  }
  /* a saved override would shadow the numbers just typed in */
  if(S.exGoals) delete S.exGoals[id];
  save(); closeSheet();
  if(onDone) onDone(id); else render();
}

/* per-exercise goals: rep range and the size of the load jump */
function openGoalsSheet(exId){
  const base = exById[exId], d = defFor(exId);
  if(base.kind === "time"){
    notice(base.n, "Cardio is logged in minutes — there's no rep range or load step to set.");
    return;
  }
  const field = (key, label, val, step, hint) => `
    <div class="goal-row">
      <div class="goal-label">${esc(label)}<small>${esc(hint)}</small></div>
      <input class="tgt-in" type="number" inputmode="decimal" min="0" step="${step}"
        data-goal="${exId}:${key}" value="${val}" aria-label="${esc(label)}">
    </div>`;

  const body = `
    ${field("rl", "Start at", d.rl, 1, "reps you aim for on a fresh load")}
    ${field("rh", "Move up at", d.rh, 1, "hit this on your best two sets")}
    ${field("inc", "Load step", d.inc, 0.5, base.u + " added when you move up")}
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:9px">
      <button class="btn btn-primary btn-wide" data-closesheet2="1">Done</button>
      ${goalsEdited(exId) ? `<button class="btn btn-wide danger" data-goalreset="${exId}">Reset to ${base.rl}–${base.rh}, ${base.inc} ${base.u}</button>` : ""}
    </div>`;

  sheet("Goals", body, `<div class="queue-hero">
      <div class="kicker">${esc(base.n)}</div>
      <div class="line">Reps climb from the first number to the second at a fixed load. Hit the
        second on your best two sets and the load goes up by the step.</div></div>`);

  document.querySelector("[data-closesheet2]").onclick = () => { closeSheet(); render(); };
  const rs = document.querySelector("[data-goalreset]");
  if(rs) rs.onclick = () => { delete S.exGoals[exId]; save(); closeSheet(); render(); };

  document.querySelectorAll("[data-goal]").forEach(el => {
    const commit = () => {
      const [id, key] = el.dataset.goal.split(":");
      const b = exById[id];
      const cur = Object.assign({}, S.exGoals[id] || {});
      let v = num(el.value);
      if(key === "inc"){ if(!(v > 0)) v = b.inc; }
      else { v = Math.round(v); if(v < 1) v = 1; if(v > 100) v = 100; }
      cur[key] = v;
      /* keep the range the right way round */
      const merged = Object.assign({rl:b.rl, rh:b.rh, inc:b.inc}, cur);
      if(merged.rl > merged.rh){
        if(key === "rl") merged.rh = merged.rl; else merged.rl = merged.rh;
      }
      S.exGoals[id] = merged;
      el.value = merged[key];
      const other = document.querySelector(`[data-goal="${id}:${key === "rl" ? "rh" : "rl"}"]`);
      if(other && key !== "inc") other.value = merged[key === "rl" ? "rh" : "rl"];
      save();
    };
    el.onchange = commit;
    el.onblur = commit;
  });
}

/* confirm what you just did, then go back to the grid */
function openConfirmSheet(exId){
  const s = workingSession();
  if(!s) return;
  const e = s.entries.find(x => x.ex === exId);
  const n = e ? e.sets.length : 0;

  const body = `
    <div style="padding:4px 16px 16px;display:flex;flex-direction:column;gap:13px">
      <div class="setline">
        ${n ? e.sets.map(x => `<span class="setpill">${setLabel(exId, x)}</span>`).join("")
            : `<span class="note" style="color:var(--muted)">Nothing logged — this one won't be saved.</span>`}
      </div>
      ${n ? effortPickerHTML((e && e.effort) || 6, "Rate Your Effort") : ""}
      ${lastEffortLine(exId)}
      ${n ? `<div class="eff-next" id="effNext"></div>` : ""}
      <button class="btn btn-primary btn-wide" data-confirm="1">Confirm · pick next</button>
      <button class="btn btn-wide" data-closesheet2="1">Keep going</button>
    </div>`;

  sheet("Log it?", body, `<div class="queue-hero">
      <div class="kicker">${n} set${n===1?"":"s"} · ${esc(exById[exId].n)}</div>
      <div class="line">${n ? "Look right? Confirm and I'll bring the grid back." : "You can still log a set, or drop this one."}</div>
    </div>`);

  /* Tapping a bar SELECTS. It used to confirm and close in the same tap, which
     cost nothing but left nowhere to think - and choosing between 7 and 8 is the
     whole value of rating it. Confirm is the second tap, and skipping the rating
     entirely still works exactly as it did. */
  /* Opens on 6 so there is something to adjust from rather than a blank. That 6
     is not written by opening the sheet - only by confirming - so backing out
     with Keep going leaves the exercise genuinely unrated. */
  let sel = (e && e.effort) || 6;
  const confirmAndNext = () => {
    const cur = workingSession();
    if(!cur){ closeSheet(); render(); return; }
    const en = cur.entries.find(x => x.ex === exId);
    if(en && en.sets.length && !en.effort) en.effort = sel;
    cur.entries = cur.entries.filter(x => x.sets.length);
    ui.openEx = null; stopRest(); save(); closeSheet(); render();
  };
  function paintEffort(v){
    sel = v;
    mountEffortPicker(v, "Rate Your Effort", pickEffort);
    const nx = document.getElementById("effNext");
    if(nx) nx.textContent = nextSessionLine(exId, v);
    const btn = document.querySelector("[data-confirm]");
    if(btn) btn.textContent = "Confirm \u00b7 " + v + " " + effortName(v);
    effortBloom(v);
  }
  function pickEffort(v){
    const cur = workingSession();
    const en = cur && cur.entries.find(x => x.ex === exId);
    if(en) en.effort = v;
    save();
    paintEffort(v);
  }
  if(n){
    mountEffortPicker(sel, "Rate Your Effort", pickEffort);
    const nx0 = document.getElementById("effNext");
    if(nx0) nx0.textContent = nextSessionLine(exId, sel);
    const btn0 = document.querySelector("[data-confirm]");
    if(btn0) btn0.textContent = "Confirm \u00b7 " + sel + " " + effortName(sel);
  }
  document.querySelector("[data-confirm]").onclick = confirmAndNext;
  document.querySelector("[data-closesheet2]").onclick = closeSheet;
}

/* ======================================================================
   WIRING
   ====================================================================== */
/* choose (or change) the day type — reuses today's session, never stacks a second one */
function startDay(dayId){
  const d = dayById[dayId];
  if(!d) return;
  const pg = (activeProgram() || {}).id || null;
  let s = workingSession();
  if(!s){
    S.sessions.push({date:todayISO(), day:d.id, name:d.n, pg,
                     plan:dayEx(d.id).slice(), entries:[]});
  } else {
    s.day = d.id; s.name = d.n; s.pg = pg;
    const tpl = dayEx(d.id);
    s.plan = [...tpl, ...s.entries.filter(e => e.sets.length && !tpl.includes(e.ex)).map(e => e.ex)];
  }
  ui.activeSession = currentSession();
  ui.openEx = null; save(); render();
}

/* an exercise picked before a day is chosen stays unlabelled */
function pickExercise(id){
  let s = workingSession();
  if(!s){
    S.sessions.push({date:todayISO(), day:null, name:null, plan:[], entries:[]});
    s = currentSession();
  }
  ui.activeSession = s;
  if(!s.entries.some(e => e.ex === id)) s.entries.push({ex:id, sets:[]});
  if(!s.plan.includes(id)) s.plan.push(id);
  ui.openEx = id; save(); render();
}

function wire(){
  const q = sel => document.querySelectorAll(sel);

  q("[data-day]").forEach(b => b.onclick = () => {
    b.classList.add("pulse");
    setTimeout(() => startDay(b.dataset.day), 130);
  });

  q("[data-pick]").forEach(b => {
    const longPressed = wireLongPress(b);
    b.onclick = () => {
      if(longPressed()) return;          /* the long press already opened the swap */
      b.classList.add("pulse");
      const id = b.dataset.pick;
      setTimeout(() => pickExercise(id), 130);
    };
  });

  q("[data-openall]").forEach(b => b.onclick = () => openCatalogue(pickExercise, "Anything else"));

  q("[data-setday]").forEach(b => b.onclick = () => startDay(b.dataset.setday));

  q("[data-back]").forEach(b => b.onclick = () => {
    const cur = currentSession();
    if(cur && !hasSets(cur)) S.sessions = S.sessions.filter(x => x !== cur);
    ui.openEx = null; save(); render();
  });

  q("[data-nudge]").forEach(b => b.onclick = () => {
    const [f, dir] = b.dataset.nudge.split(":");
    const def = defFor(ui.openEx);
    const el = document.getElementById(f === "w" ? "inW" : f === "r" ? "inR" : "inT");
    const step = f === "w" ? def.inc : f === "t" ? (def.step || 5) : 1;
    let v = num(el.value) + (dir === "+" ? step : -step);
    if(v < 0) v = 0;
    v = Math.round(v*100)/100;
    /* weight bottoms out at bodyweight, and says so */
    if(f === "w"){
      el.value = w(v);
      const minus = document.querySelector('[data-nudge="w:-"]');
      if(minus) minus.classList.toggle("atfloor", v <= 0);
    } else {
      el.value = v;
    }
  });

  /* anything unparseable — blank, "0", a stray letter — settles back to BW */
  const wIn = document.getElementById("inW");
  if(wIn) wIn.onblur = () => {
    const v = num(wIn.value);
    wIn.value = w(v < 0 ? 0 : v);
    const minus = document.querySelector('[data-nudge="w:-"]');
    if(minus) minus.classList.toggle("atfloor", v <= 0);
  };

  q("[data-logset]").forEach(b => b.onclick = () => {
    const s = workingSession();
    if(!s) return;
    const e = s.entries.find(x => x.ex === b.dataset.logset);
    if(!e) return;
    if(isTime(b.dataset.logset)){
      const t = Math.round(num(document.getElementById("inT").value));
      if(t <= 0) return;
      e.sets.push({t});
      ui.freshSet = true; save(); render();
      openConfirmSheet(b.dataset.logset);
      return;
    }
    const wv = num(document.getElementById("inW").value);
    const rv = Math.round(num(document.getElementById("inR").value));
    if(rv <= 0) return;
    e.sets.push({w:wv, r:rv});
    ui.freshSet = true;
    b.classList.add("flash");
    save(); startRest();
    setTimeout(render, 120);
  });

  q("[data-next]").forEach(b => b.onclick = () => openConfirmSheet(b.dataset.next));

  q("[data-del]").forEach(b => b.onclick = () => {
    const [id, i] = b.dataset.del.split(":");
    const s = workingSession(); if(!s) return;
    const e = s.entries.find(x => x.ex === id);
    if(!e) return;
    askConfirm({
      title:"Delete set",
      kicker:exById[id].n,
      line:"Remove " + setLabel(id, e.sets[+i]) + " from this exercise?",
      yes:"Delete set", danger:true,
      onYes(){ e.sets.splice(+i,1); save(); render(); }
    });
  });

  q("[data-rmex]").forEach(b => b.onclick = () => {
    const s = workingSession(); if(!s) return;
    s.entries = s.entries.filter(x => x.ex !== b.dataset.rmex);
    ui.openEx = null; save(); render();
  });

  q("[data-end]").forEach(b => b.onclick = () => {
    const s = workingSession(); if(!s) return;
    s.entries = s.entries.filter(e => e.sets.length);
    if(!s.entries.length && !s.day) S.sessions = S.sessions.filter(x => x !== s);
    ui.openEx = null; ui.activeSession = null; stopRest(); save();
    ui.tab = "history"; ui.logMode = "cal"; ui.calDay = s.date; render();
  });

  q("[data-hist]").forEach(b => b.onclick = () => {
    ui.histEx = b.dataset.hist || null; ui.tab = "history"; render();
  });
  q("[data-histsheet]").forEach(b => b.onclick = () => openHistorySheet(b.dataset.histsheet));
  q("[data-editsess]").forEach(b => b.onclick = () => openEditSession(b.dataset.editsess));
  q("[data-swap]").forEach(b => b.onclick = () => openSwapSheet(b.dataset.swap));
  q("[data-muscle]").forEach(b => b.onclick = () => openMuscleSheet(b.dataset.muscle));
  q("[data-discard]").forEach(b => b.onclick = () => {
    const cur = workingSession();
    if(!cur) return;
    const n = cur.entries.reduce((a,e) => a + e.sets.length, 0);
    askConfirm({
      title:"Discard session",
      kicker:(cur.day ? sessName(cur) : "Today") + " · " + n + " set" + (n===1?"":"s"),
      line:"Throws away everything logged today. This can't be undone.",
      yes:"Discard it", danger:true,
      onYes(){
        S.sessions = S.sessions.filter(x => x !== cur);   /* by identity, not by date */
        ui.openEx = null; ui.activeSession = null; stopRest(); save();
        verifyGone(cur.date);
        render();
      }
    });
  });

  q("[data-delsess]").forEach(b => b.onclick = () => {
    const d = b.dataset.delsess;
    const sess = S.sessions.find(x => x.date === d);
    if(!sess) return;
    const n = sess.entries.reduce((a,e) => a + e.sets.length, 0);
    askConfirm({
      title:"Delete session",
      kicker:sessName(sess) + " · " + fmtDate(d),
      line:n + " set" + (n===1?"":"s") + " will be gone for good. This can't be undone.",
      yes:"Delete it", danger:true,
      onYes(){
        S.sessions = S.sessions.filter(x => x.date !== d);
        if(ui.calDay === d) ui.calDay = null;
        if(d === todayISO()) ui.openEx = null;
        save();
        verifyGone(d);
        render();
      }
    });
  });

  q("[data-logmode]").forEach(b => b.onclick = () => { ui.logMode = b.dataset.logmode; render(); });
  q("[data-cal]").forEach(b => b.onclick = () => {
    ui.calMonth = shiftMonth(ui.calMonth || monthOf(todayISO()), +b.dataset.cal); render();
  });
  q("[data-calday]").forEach(b => b.onclick = () => {
    ui.calDay = ui.calDay === b.dataset.calday ? null : b.dataset.calday; render();
  });

  /* --- setup: programs --- */
  q("[data-pgopen]").forEach(b => b.onclick = () => openProgramSheet(b.dataset.pgopen));
  const np = document.getElementById("newPg");
  if(np) np.onclick = openNewProgramSheet;

  const flash = id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("on"), 1400);
  };

  q("[data-goals]").forEach(b => b.onclick = () => openGoalsSheet(b.dataset.goals));
  q("[data-cxgoals]").forEach(b => b.onclick = () => openEditSheet(b.dataset.cxgoals, () => render()));

  const tc = document.getElementById("testChime");
  if(tc) tc.onclick = () => { unlockAudio(); setTimeout(chimeNow, 120); };

  const nx = document.getElementById("newExBtn");
  if(nx) nx.onclick = () => openCreateSheet(() => render());

  q("[data-cxdel]").forEach(b => b.onclick = () => {
    const id = b.dataset.cxdel;
    const rec = S.customEx.find(x => x.id === id);
    if(!rec) return;
    if(rec.archived){                      /* restore */
      delete rec.archived; delete exById[id].archived;
      save(); render(); return;
    }
    const used = exHistory(id).length;
    askConfirm({
      title: used ? "Archive exercise" : "Delete exercise",
      kicker: rec.n,
      line: used
        ? "Logged on " + used + " session" + (used===1?"":"s") + ". It leaves the catalogue and your day templates, but those sessions keep its name. You can restore it here."
        : "Never logged, so nothing is lost. It will be removed completely.",
      yes: used ? "Archive it" : "Delete it", danger:true,
      onYes(){
        if(used){ rec.archived = true; exById[id].archived = true; }
        else {
          S.customEx = S.customEx.filter(x => x.id !== id);
          const i = EX.findIndex(x => x.id === id); if(i > -1) EX.splice(i,1);
          delete exById[id];
          (S.programs || []).forEach(p => (p.days || []).forEach(dy => {
            dy.ex = (dy.ex || []).filter(x => x !== id);
          }));
        }
        save(); render();
      }
    });
  });

  const og = document.getElementById("openGoals");
  if(og) og.onclick = () => openCatalogue(openGoalsSheet, "Set goals for");

  q("[data-tgt]").forEach(el => {
    const commit = () => {
      const [id, side] = el.dataset.tgt.split(":");
      const cur = targetFor(id);
      let v = Math.round(num(el.value));
      if(!isFinite(v) || v < 0) v = 0;
      if(v > 60) v = 60;
      const next = {lo:cur.lo, hi:cur.hi};
      next[side] = v;
      if(next.lo > next.hi){                 /* keep the band the right way round */
        if(side === "lo") next.hi = v; else next.lo = v;
      }
      S.targets[id] = next;
      el.value = v;
      save(); flash("tgtSaved");
    };
    el.onchange = commit;
    el.onblur = commit;
  });

  const tr = document.getElementById("tgtReset");
  if(tr) tr.onclick = () => askConfirm({
    title:"Reset targets",
    kicker:"Back to the defaults",
    line:"Every weekly target returns to the starting numbers. Your logged sets are untouched.",
    yes:"Reset targets",
    onYes(){ S.targets = defaultTargets(); save(); render(); }
  });

  const nm = document.getElementById("nameIn");
  if(nm) nm.oninput = () => { S.name = nm.value.trim() || "there"; save(); flash("nameSaved"); };

  q("[data-theme-set]").forEach(b => b.onclick = () => {
    S.theme = b.dataset.themeSet; S.themeSet = true; save(); applyTheme(); render();
  });
  const rl = document.getElementById("restLen");
  const setRest = v => {
    v = Math.round(v);
    if(!isFinite(v) || v < 15) v = 15;
    if(v > 600) v = 600;
    S.restLen = v; save(); flash("restSaved");
    return v;
  };
  if(rl){
    /* typed straight into the box — this is what wasn't saving */
    rl.oninput  = () => { if(rl.value !== "") setRest(num(rl.value)); };
    rl.onblur   = () => { rl.value = setRest(num(rl.value)); };
    rl.onchange = () => { rl.value = setRest(num(rl.value)); };
  }
  q("[data-rest]").forEach(b => b.onclick = () => {
    rl.value = setRest(num(rl.value) + (b.dataset.rest === "+" ? 15 : -15));
  });

  const su = document.getElementById("syncUrl"), st = document.getElementById("syncToken");
  const commitSync = () => {
    const c = syncCfg();
    if(su){
      const v = su.value.trim();
      if(v && !validEndpoint(v)){
        notice("That URL won't work",
          "It needs to be the https://script.google.com/... /exec address from Deploy. " +
          "Anything else would send your training data somewhere it shouldn't go.");
        su.value = c.url;
        return;
      }
      c.url = v;
    }
    if(st) c.token = st.value.trim();
    save(); flash("syncSaved");
  };
  if(su){ su.onchange = commitSync; su.onblur = commitSync; }
  if(st){ st.onchange = commitSync; st.onblur = commitSync; }

  const sr = document.getElementById("syncReveal");
  if(sr) sr.onclick = () => { ui.showSecrets = !ui.showSecrets; render(); };

  const sn = document.getElementById("syncNow");
  if(sn && !sn.disabled) sn.onclick = async () => {
    sn.textContent = "Syncing…";
    await flushSync(true);
    sn.textContent = "Sync now";
    if(syncCfg().lastErr) notice("Sync failed", syncCfg().lastErr +
      " — check the URL and the secret match the script, and that it is deployed with access set to Anyone.");
    render();
  };

  const sa = document.getElementById("syncAll");
  if(sa && !sa.disabled) sa.onclick = () => askConfirm({
    title:"Resend everything",
    kicker:S.sessions.length + " sessions",
    line:"Rewrites every session into the Sheet. Use this if the Sheet and the app have drifted apart.",
    yes:"Resend all",
    onYes(){ syncCfg().synced = {}; save(); flushSync(true); }
  });

  const wipe = document.getElementById("wipeAll");
  if(wipe) wipe.onclick = () => askConfirm({
    title:"Erase everything",
    kicker:(S.sessions||[]).length + " sessions on this device",
    line:"Every session, template edit, and setting stored at this address is deleted. There is no undo — copy your backup first if you might want it.",
    yes:"Erase it all", danger:true,
    onYes(){
      try{ localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    }
  });

  const cp = document.getElementById("copyDump");
  if(cp) cp.onclick = () => {
    const t = document.getElementById("dump");
    t.select(); t.setSelectionRange(0, 999999);
    try{ navigator.clipboard.writeText(t.value); cp.textContent = "Copied"; }
    catch(e){ cp.textContent = "Select all and copy"; }
    setTimeout(() => cp.textContent = "Copy backup", 1800);
  };
  const rs = document.getElementById("doRestore");
  if(rs) rs.onclick = () => {
    let d = null;
    try{
      d = JSON.parse(document.getElementById("restoreBox").value);
      if(!d.sessions) d = null;
    }catch(e){ d = null; }
    if(!d){
      notice("Can't read that", "Paste the whole backup text you copied, including the brackets at each end.");
      return;
    }
    askConfirm({
      title:"Restore backup",
      kicker:d.sessions.length + " sessions in this backup",
      line:"This replaces everything currently in the app.",
      yes:"Replace my log", danger:true,
      onYes(){
        const keep = syncCfg();                    /* this device's own credentials */
        S = d;
        if(!S.templates) S.templates = defaultTemplates();
        migratePrograms(S);
        if(!S.name) S.name = "there";
        S.sync = Object.assign({url:"",token:"",synced:{},lastOk:null,lastErr:null},
                               S.sync || {}, {url:keep.url, token:keep.token});
        S.sync.synced = {};                        /* restored data must be re-pushed */
        save(); applyTheme(); render();
      }
    });
  };
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  ui.showSecrets = false;              /* never leave credentials on screen */
  ui.tab = t.dataset.tab;
  if(t.dataset.tab === "history"){ ui.histEx = null; ui.calDay = null; }
  render();
});

/* iOS keeps a home-screen app's page alive for a long time, so it can sit on an
   old build indefinitely. Ask the server what the current build is; if it differs,
   offer a reload. Fails silently with no connection. */
async function checkBuild(){
  try{
    const r = await fetch("version.txt?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const latest = (await r.text()).trim();
    if(latest && latest !== BUILD){
      document.getElementById("updateBar").classList.remove("hidden");
      document.getElementById("updateBtn").onclick = () =>
        location.replace(location.pathname + "?v=" + encodeURIComponent(latest));
    }
  }catch(e){ /* offline — nothing to do */ }
}
checkBuild();
restoreRest();
flushSync(false);
document.addEventListener("visibilitychange", () => {
  if(document.hidden && ui.showSecrets){ ui.showSecrets = false; render(); }
  if(!document.hidden){ checkBuild(); flushSync(false); resumeRest(); }
});
window.addEventListener("online", () => flushSync(false));

applyTheme();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", applyTheme);
if(S.pruned){ delete S.pruned; save(); }   /* write the cleanup through */
render();
