<title>PR Max</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- media=print makes this non-blocking, then it is switched on once it lands.
     Blocking on Google over gym signal was costing seconds of blank screen on
     every cold start; every stack below falls back to a real system font. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F8F4">

<style>
:root{
  --ground:#F7F8F4;
  --surface:#FFFFFF;
  --surface-2:#EDEFE8;
  --line:#DBDFD2;
  --line-strong:#A6AD99;
  --text:#12150F;
  --muted:#4C5546;
  --faint:#68715F;
  --accent:#3F6E12;
  --accent-bright:#A6E22E;
  --accent-pale:#CDEB8F;
  --accent-soft:#EAF7D0;
  --on-lime:#12150F;
  --ready:#0F766E;
  --ready-soft:#D6F2EE;
  --hold:#835E0C;
  --hold-soft:#F5EBD3;
  --stall:#A63A27;
  --indirect:#3E6FA8;
  --stall-soft:#F7E0DA;
  --bloom:rgba(166,58,39,.42);
  --eff-grid:rgba(18,21,15,.30);
  --shadow:0 1px 2px rgba(18,21,15,.08),0 6px 18px rgba(18,21,15,.05);

  --f-disp:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101208;
    --surface:#191D14;
    --surface-2:#242A1D;
    --line:#38402F;
    --line-strong:#5C6651;
    --text:#F1F4EA;
    --muted:#B9C2AE;
    --faint:#9AA48F;
    --accent:#B6E84A;
    --accent-bright:#A6E22E;
    --accent-pale:#5E7F2E;
    --accent-soft:#25330F;
    --on-lime:#12150F;
    --ready:#5EEAD4;
    --ready-soft:#0F2E2A;
    --hold:#E6BE68;
    --hold-soft:#3A2C0B;
    --stall:#F0907A;
    --indirect:#8FBCE8;
    --stall-soft:#40201A;
    --bloom:rgba(240,144,122,.42);
    --eff-grid:rgba(245,245,245,.34);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#101208;
  --surface:#191D14;
  --surface-2:#242A1D;
  --line:#38402F;
  --line-strong:#5C6651;
  --text:#F1F4EA;
  --muted:#B9C2AE;
  --faint:#9AA48F;
  --accent:#B6E84A;
  --accent-bright:#A6E22E;
  --accent-pale:#5E7F2E;
  --accent-soft:#25330F;
  --on-lime:#12150F;
  --ready:#5EEAD4;
  --ready-soft:#0F2E2A;
  --hold:#E6BE68;
  --hold-soft:#3A2C0B;
  --stall:#F0907A;
  --indirect:#8FBCE8;
  --stall-soft:#40201A;
  --bloom:rgba(240,144,122,.42);
  --eff-grid:rgba(245,245,245,.34);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--f-body);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);padding:10px 16px 8px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:23px;letter-spacing:.06em;
  text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.top-meta{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.04em}

/* ---------- generic ---------- */
.wrap{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:12px 14px}
.hidden{display:none!important}

.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
  padding:13px 16px;min-height:48px;font-weight:600;font-size:15px;
  -webkit-tap-highlight-color:transparent;transition:transform .09s ease,background .12s ease}
.btn:active{background:var(--surface-2);transform:scale(.96)}
.btn-primary{background:var(--accent-bright);border-color:var(--accent-bright);
  color:var(--on-lime);font-size:16px;min-height:56px}
.btn-primary:active{background:var(--accent-bright)}
.btn-primary.flash{animation:flash .42s ease}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(166,226,46,.85)}
  100%{box-shadow:0 0 0 16px rgba(166,226,46,0)}
}
.btn-wide{width:100%;text-align:center}
.btn-row{display:flex;gap:8px}
.btn-row>*{flex:1}

.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--text);white-space:nowrap;border:1px solid var(--line)}
.chip.ready{background:var(--ready-soft);color:var(--ready);border-color:var(--ready)}
.chip.stall{background:var(--stall-soft);color:var(--stall);border-color:var(--stall)}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---------- greeting ---------- */
.hello{font-family:var(--f-disp);font-size:34px;font-weight:600;line-height:1.05;
  letter-spacing:.01em;text-wrap:balance}
.hello em{font-style:normal;color:var(--accent)}
.hello-sub{font-size:16px;color:var(--muted);margin-top:6px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:15px 13px;min-height:88px;box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;transition:transform .09s ease,border-color .12s ease;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile:active{transform:scale(.96);border-color:var(--accent)}
.tile b{font-family:var(--f-disp);font-size:23px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;line-height:1.05}
.tile small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.tile .pills{margin-top:3px}
.tile.wide{grid-column:1 / -1;min-height:60px;flex-direction:row;align-items:center;gap:9px}
.tile.wide b{font-size:19px}
.tile.add{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.tile.add b{color:var(--accent)}
.tile.done{opacity:.5}
.tile.done b::before{content:"✓ ";color:var(--ready)}
.tile.pulse{animation:pulse .3s ease}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(166,226,46,.9)}
  100%{box-shadow:0 0 0 14px rgba(166,226,46,0)}
}
.tile-chip{margin-top:5px}

/* ---------- logger ---------- */
.logger{display:flex;flex-direction:column;gap:11px;padding:14px}
.log-name{font-family:var(--f-disp);font-size:27px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;line-height:1.05}
.log-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.target{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;display:flex;flex-direction:column;gap:2px}
.hint-line{font-family:var(--f-mono);line-height:1.45}
.hint-lead{font-size:13.5px;font-weight:600;color:var(--text)}
.hint-body{font-size:12.5px;color:var(--muted)}
.hint-pace{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:2px}
.hint-pace.stall{color:var(--stall)}
.hint-pace.ready{color:var(--accent)}
.hint-note{font-size:12px;color:var(--faint);margin-top:3px;font-style:italic}
.setline{display:flex;gap:7px;flex-wrap:wrap}
.setpill{font-family:var(--f-mono);font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px;
  background:var(--surface-2);color:var(--text);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);min-height:34px;display:inline-flex;align-items:center}
.setpill.fresh{animation:pop .2s ease}

/* read-only sets: same object as a logged set pill, sized to sit in a list */
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills.right{justify-content:flex-end}
.pill-mini{font-family:var(--f-mono);font-size:11.5px;font-weight:500;
  padding:2.5px 6px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35}
@keyframes pop{from{transform:scale(.78);opacity:0}to{transform:scale(1);opacity:1}}

.stepper{display:flex;flex-direction:column;gap:11px}
.step-group{display:flex;flex-direction:column;gap:5px;min-width:0}
.step-label{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.step-ctl{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:9px;
  overflow:hidden;background:var(--surface)}
.step-ctl button{flex:0 0 64px;min-height:54px;border:0;background:var(--surface-2);
  font-size:26px;font-weight:500;line-height:1;color:var(--text);
  -webkit-tap-highlight-color:transparent;transition:background .1s ease}
.step-ctl button:first-child{border-right:1px solid var(--line)}
.step-ctl button:last-child{border-left:1px solid var(--line)}
.step-ctl button:active{background:var(--accent-bright);color:var(--on-lime)}
.step-ctl button.atfloor{color:var(--faint)}
.step-ctl button.atfloor:active{background:var(--surface-2);color:var(--faint)}
.step-ctl input{flex:1 1 auto;min-width:0;width:100%;border:0;background:none;text-align:center;
  font-family:var(--f-mono);font-size:25px;font-weight:600;color:var(--text);
  padding:10px 4px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step-ctl input::-webkit-outer-spin-button,.step-ctl input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}

/* ---------- rest timer ---------- */
.rest{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;
  display:flex;justify-content:center;pointer-events:none}
.rest-inner{pointer-events:auto;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  border-radius:999px;padding:6px 7px 6px 16px;margin:0 12px}
.rest-time{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
/* his ringer is normally off, so this is the alert, not a decoration */
.rest.done .rest-inner{background:var(--accent-bright);border-color:var(--accent-bright);
  animation:restpop 1s ease-in-out 3}
.rest.done .rest-time{color:#0E1113}
.rest.done .btn{background:rgba(0,0,0,.09);border-color:rgba(0,0,0,.22);color:#0E1113}
@keyframes restpop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rest-inner .btn{padding:7px 13px;font-size:13px;border-radius:999px;min-height:40px}

/* ---------- volume ---------- */
.vol{display:flex;flex-direction:column;gap:9px;padding:12px 14px}
.vol-row{display:grid;grid-template-columns:104px 1fr 38px;gap:10px;align-items:center;
  width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;
  -webkit-tap-highlight-color:transparent;transition:opacity .1s ease}
.vol-row:active{opacity:.6}
.vol-name{font-size:14px;font-weight:500;line-height:1.2}
.vol-name small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);
  font-weight:400;letter-spacing:.02em;margin-top:1px}
.vol-track{height:12px;background:var(--surface-2);border-radius:999px;
  overflow:hidden;position:relative}
.vol-bars{position:absolute;inset:0;display:flex}
.vol-fill{height:100%;background:var(--accent-bright)}
.vol-sec{height:100%;background:var(--indirect)}
.vol-fill.low{background:var(--accent-pale)}
.vol-fill.high{background:var(--hold)}
.vol-zone{position:absolute;top:0;bottom:0;background:var(--accent-soft);
  border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong)}
.vol-num{font-family:var(--f-mono);font-size:15px;font-weight:600;text-align:right;
  color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15}
.vol-num small{display:block;font-size:10.5px;font-weight:600;color:var(--indirect)}
.vol-num.low{color:var(--muted)}
.vol-num.high{color:var(--hold)}

/* ---------- history / calendar ---------- */
.hist-item{padding:11px 14px;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:0}
.hist-date{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
.hist-title{font-family:var(--f-disp);font-size:19px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;margin-top:1px}
.hist-body{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.hist-line{display:flex;gap:10px;font-size:13.5px;align-items:flex-start;padding:1.5px 0}
.hist-line .n{flex:1;min-width:0;color:var(--muted);padding-top:2px}
.hist-line .pills{flex:0 1 auto;max-width:64%}

.cal-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.cal-title{font-family:var(--f-disp);font-size:20px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;flex:1;text-align:center}
.cal-nav{width:44px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:9px;font-size:19px;line-height:1;-webkit-tap-highlight-color:transparent}
.cal-nav:active{transform:scale(.94)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:18px;grid-auto-rows:46px;gap:5px;padding:8px 14px 12px}
.cal-dow{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);text-align:center;line-height:18px}
.cal-cell{height:46px;min-width:0;border-radius:9px;border:1px solid transparent;
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;padding:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
.cal-cell:active{transform:scale(.92)}
.cal-cell.blank{background:none}
.cal-cell .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1}
.cal-cell .k{font-family:var(--f-disp);font-size:17px;font-weight:700;line-height:1}
.cal-cell.off{background:transparent;border-color:var(--line)}
.cal-cell.off .d{font-size:14px;color:var(--muted)}
.cal-cell.today{border-color:var(--text);border-width:2px}
.cal-cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cal-cell.U{background:var(--accent-soft)}  .cal-cell.U .k{color:var(--accent)}
.cal-cell.L{background:var(--ready-soft)}   .cal-cell.L .k{color:var(--ready)}
.cal-cell.A{background:var(--hold-soft)}    .cal-cell.A .k{color:var(--hold)}
.cal-cell.X{background:var(--stall-soft)}   .cal-cell.X .k{color:var(--stall);font-size:13px}
.cal-cell.C{background:var(--surface-2);border-color:var(--line-strong)} .cal-cell.C .k{color:var(--muted)}
.cal-cell.Q{background:var(--surface-2);border-color:var(--line)} .cal-cell.Q .k{color:var(--faint)}
.cal-key{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 13px}
.cal-key span{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px}
.cal-key .U{background:var(--accent-soft);color:var(--accent)}
.cal-key .L{background:var(--ready-soft);color:var(--ready)}
.cal-key .A{background:var(--hold-soft);color:var(--hold)}
.cal-key .X{background:var(--stall-soft);color:var(--stall)}
.cal-key .C{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong)}

/* ---------- tabs ---------- */
.update-bar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));
  z-index:45;display:flex;justify-content:center;padding:0 12px}
.update-bar button{width:100%;max-width:496px;border:0;border-radius:999px;
  background:var(--accent-bright);color:var(--on-lime);font-weight:600;font-size:14px;
  padding:12px 16px;min-height:46px;box-shadow:var(--shadow)}
.update-bar button:active{transform:scale(.98)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs-inner{max-width:520px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:10px 4px 11px;min-height:58px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  -webkit-tap-highlight-color:transparent;transition:transform .09s ease}
.tab:active{transform:scale(.92)}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.3}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,14,8,.5);
  display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--ground);width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  overscroll-behavior:contain;border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--ground);padding:14px 16px 10px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.sheet-title{font-family:var(--f-disp);font-size:21px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em}
.pick{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 16px;min-height:58px;text-align:left;
  transition:background .1s ease}
.pick:active{background:var(--surface-2)}
.pick b{font-weight:600;font-size:15.5px}
.pick small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);
  letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.pick-row{display:flex;align-items:center;gap:10px;width:100%}
.pick-last{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;margin-left:auto;text-align:right}
.pick-done{opacity:.5}
.queue-hero{padding:16px 16px 4px}
.queue-hero .kicker{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent)}
.queue-hero .line{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ---------- setup ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}

/* effort picker - ten ascending bars, tap to rate */
.eff{display:flex;flex-direction:column;gap:9px}

  text-transform:uppercase;color:var(--muted)}
/* touch-action:none so a drag across the bars rates instead of scrolling the

.eff-bars{display:flex;align-items:flex-end;gap:3px;height:60px;touch-action:none}
.eff-bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;

.eff-bar span{display:block;width:100%;border-radius:4px 4px 3px 3px;

.eff-bar:active span{transform:scaleY(1.1)}
.eff-bar.band0 span{background:var(--ready-soft)}
.eff-bar.band1 span{background:var(--accent-soft)}
.eff-bar.band2 span{background:var(--hold-soft)}
.eff-bar.band3 span{background:var(--stall-soft)}
/* the one you picked goes solid, the way the reference does it */
/* Each bar carries its own band colour, so the wave changes hue as it climbs
   the ramp. The overlay pulses to that solid colour and the per-bar delay makes
   it read as one wave travelling left to right rather than ten blinks. */
.eff-bar.band0{color:var(--ready)}
.eff-bar.band1{color:var(--accent)}
.eff-bar.band2{color:var(--hold)}
.eff-bar.band3{color:var(--stall)}
.eff-bar span{position:relative;overflow:hidden}
.eff-bar span::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:currentColor;opacity:0}
@keyframes barwave{0%,100%{opacity:0}45%{opacity:.62}}
.eff.lvl0 .eff-bar.lit span::after{animation:barwave 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * 240ms)}
.eff.lvl1 .eff-bar.lit span::after{animation:barwave 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * 180ms)}
.eff.lvl2 .eff-bar.lit span::after{animation:barwave 1.7s ease-in-out infinite;
  animation-delay:calc(var(--i) * 130ms)}
.eff.lvl3 .eff-bar.lit span::after{animation:barwave 1.15s ease-in-out infinite;
  animation-delay:calc(var(--i) * 90ms)}
/* the one you picked holds steady while the rest ripple past it */
.eff-bar.on span::after{animation:none!important}
.eff-bar.band0.on span{background:var(--ready)}
.eff-bar.band1.on span{background:var(--accent)}
.eff-bar.band2.on span{background:var(--hold)}
.eff-bar.band3.on span{background:var(--stall)}
.eff-strip{position:relative;overflow:hidden;border-radius:11px;min-height:64px;

  background:var(--surface-2);border:1px solid var(--line)}

  display:flex;align-items:center;justify-content:center;background:var(--surface);
  border:1.5px solid currentColor;font-family:var(--f-disp);font-size:20px;font-weight:700}
.eff-strip .t{position:relative;z-index:2;min-width:0}
.eff-strip .w{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;line-height:1.2}
.eff-strip .s{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.eff-strip.empty .s{font-size:14px}
/* The Ultracode texture, measured off Brandon's screen recording rather than
   guessed at: 1px gutters every 5px in both axes, so 4px cells - a grid, not
   the checkerboard the first attempt used. Revealed by a mask that sweeps. */
.eff-strip::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background-image:
    repeating-linear-gradient(90deg,var(--eff-grid) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(0deg, var(--eff-grid) 0 1px,transparent 1px 5px);
  -webkit-mask-image:linear-gradient(100deg,transparent 32%,#000 44%,#000 56%,transparent 68%);
          mask-image:linear-gradient(100deg,transparent 32%,#000 44%,#000 56%,transparent 68%);
  -webkit-mask-size:300% 100%;  mask-size:300% 100%;
  -webkit-mask-position:140% 0; mask-position:140% 0}
@keyframes effsweep{
  from{-webkit-mask-position:140% 0; mask-position:140% 0}
  to  {-webkit-mask-position:-60% 0; mask-position:-60% 0}}
.eff-strip.band0::before{opacity:.16;animation:effsweep 7s linear infinite}
.eff-strip.band1::before{opacity:.24;animation:effsweep 5.2s linear infinite}
.eff-strip.band2::before{opacity:.34;animation:effsweep 3.6s linear infinite}
.eff-strip.band3::before{opacity:.46;animation:effsweep 2.2s linear infinite}
.eff-last{font-family:var(--f-mono);font-size:12px;color:var(--faint);
  margin-top:-3px;letter-spacing:.02em}
.eff-next{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);
  margin-top:-6px;letter-spacing:.02em}
.eff-next:empty{display:none}
.eff-fl{flex:0 0 auto;margin-left:auto;position:relative;z-index:2;width:32px;height:38px}
.eff-fl svg{display:block;width:100%;height:100%}
/* No doctype on this document, so it renders in quirks mode and CSS class
   matching is case-INSENSITIVE. Frame and part classes must therefore differ by
   more than case - .fB was silently matching .fb and hiding every body pixel. */
.eff-fl .flm-b{fill:currentColor;opacity:.92}
.eff-fl .flm-c{fill:currentColor;opacity:.3}
.eff-fl .flm-s{fill:currentColor;opacity:.5}
.eff-fl .flm-two{opacity:0}
@keyframes flmOne{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flmTwo{0%,49%{opacity:0}50%,100%{opacity:1}}
.eff-strip.band0 .flm-one{animation:flmOne 1.6s steps(1) infinite}
.eff-strip.band0 .flm-two{animation:flmTwo 1.6s steps(1) infinite}
.eff-strip.band1 .flm-one{animation:flmOne 1.1s steps(1) infinite}
.eff-strip.band1 .flm-two{animation:flmTwo 1.1s steps(1) infinite}
.eff-strip.band2 .flm-one{animation:flmOne .72s steps(1) infinite}
.eff-strip.band2 .flm-two{animation:flmTwo .72s steps(1) infinite}
.eff-strip.band3 .flm-one{animation:flmOne .44s steps(1) infinite}
.eff-strip.band3 .flm-two{animation:flmTwo .44s steps(1) infinite}
.eff-strip.band0{background:var(--ready-soft);border-color:var(--ready)}

/* One-way migration into programs. d.templates is deliberately left on disk
   untouched - it costs a few hundred bytes and it is the only copy of the old
   shape if this ever needs unpicking. Day ids are preserved, so every session
   already logged keeps resolving with no data change at all.
   Runs before todayISO() exists, so dates come from the log, never the clock. */
function migratePrograms(d){
  if(d.programs && d.programs.length){
    if(!d.activeProgram) d.activeProgram = d.programs[0].id;
    return d;
  }
  const tpl = d.templates || defaultTemplates();
  const dates = (d.sessions || []).map(x => x.date).filter(Boolean).sort();
  d.programs = [{
    id: "pg_1",
    n: "My Split",
    days: DEFAULT_DAYS.map(x => ({id:x.id, n:x.n, key:x.key, ex:(tpl[x.id] || []).slice()})),
    started: dates[0] || null,
    ended: null,
  }];
  d.activeProgram = "pg_1";
  return d;
}

function load(){
  let d = null;
  try{ const raw = localStorage.getItem(KEY); if(raw) d = JSON.parse(raw); }catch(e){}
  if(!d) d = {sessions: seed(), restLen: 90};
  /* Tapping a day tile creates a session immediately. If nothing was ever
     logged into it, it is not a workout — drop it so reopening the app
     greets you instead of resuming a phantom session. */
  const before = (d.sessions || []).length;
  d.sessions = (d.sessions || []).filter(x =>
    x && x.entries && x.entries.some(e => e.sets && e.sets.length));
  d.pruned = before !== d.sessions.length;
  if(!d.templates) d.templates = defaultTemplates();
  migratePrograms(d);
  if(!d.targets) d.targets = defaultTargets();
  if(!d.exGoals) d.exGoals = {};
  if(!d.customEx) d.customEx = [];
  if(!d.sync) d.sync = {url:"", token:"", synced:{}, lastOk:null, lastErr:null};
  if(!d.name) d.name = "there";
  if(!d.restLen) d.restLen = 90;
  if(!d.themeSet){ d.theme = "light"; d.themeSet = true; }   /* white by default */
  return d;
}

/* ============ Google Sheet mirror =====================================
   Twelve different places mutate sessions, and every one calls save().
   Rather than hook all twelve (and miss one), work out what changed by
   comparing each session against a fingerprint of what the Sheet holds.
   Self-healing: five offline edits collapse into one push of final state. */

/* strip anything secret out of a string before it is stored or displayed */
function scrub(msg){
  const c = S.sync || {};
  let out = String(msg);
  if(c.url)   out = out.split(c.url).join("[url]");
  if(c.token) out = out.split(c.token).join("[secret]");
  return out;
}

/* only an https Apps Script /exec endpoint — http would send the log in the
   clear, and a wrong host would send it to a stranger */
function validEndpoint(u){
  try{
    const x = new URL(u);
    return x.protocol === "https:"
        && x.hostname === "script.google.com"
        && /\/exec$/.test(x.pathname);
  }catch(e){ return false; }
}

function syncCfg(){ return (S.sync = S.sync || {url:"",token:"",synced:{},lastOk:null,lastErr:null}); }
const syncOn = () => !!(syncCfg().url && syncCfg().token);

/* one row per set, matching HEADERS in sheet-sync.gs */
function sheetRows(sess){
  const rows = [];
  sess.entries.forEach(e => {
    const def = exById[e.ex] || {n:e.ex, m:"", equip:""};
    e.sets.forEach((x, i) => rows.push([
      sess.date,
      sess.day ? (dayById[sess.day] || {n:sess.day}).n : "",
      def.n,
      (muscleById[def.m] || {n:def.m || ""}).n,
      def.equip || "",
      isTime(e.ex) ? "" : (x.w === 0 ? "BW" : x.w),
      isTime(e.ex) ? "" : x.r,
      isTime(e.ex) ? x.t : "",
      i + 1
    ]));
  });
  return rows;
}

function fingerprint(sess){
  const str = JSON.stringify(sheetRows(sess));
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36) + ":" + str.length;
}

/* what the Sheet is missing right now */
function syncDiff(){
  const cfg = syncCfg(), ops = [];
  const live = {};
  S.sessions.forEach(x => { live[x.date] = x; });
  for(const d in live){
    const fp = fingerprint(live[d]);
    if(cfg.synced[d] !== fp) ops.push({action:"upsert", date:d, rows:sheetRows(live[d]), fp});
  }
  for(const d in cfg.synced){
    if(!live[d]) ops.push({action:"delete", date:d, rows:[], fp:null});
  }
  return ops;
}
const syncPending = () => (syncOn() ? syncDiff().length : 0);

let syncing = null;                 /* holds the in-flight push, if any */
async function flushSync(manual){
  const cfg = syncCfg();
  if(!syncOn()) return;
  if(!validEndpoint(cfg.url)){ cfg.lastErr = "endpoint is not a valid https Apps Script URL"; return; }
  if(syncing){
    /* a background push is already running. Tapping Sync now must not
       silently no-op, so wait for it and then push whatever is still left. */
    if(!manual) return;
    await syncing;
    if(!syncDiff().length) return;
  }
  const ops = syncDiff();
  if(!ops.length){ if(manual){ cfg.lastErr = null; save(); render(); } return; }
  let done;
  syncing = new Promise(r => { done = r; });
  try{
    /* text/plain keeps this a "simple" request, so the browser skips the CORS
       preflight that Apps Script cannot answer. Without it, nothing works. */
    const res = await fetch(cfg.url, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({token: cfg.token, ops: ops.map(o => ({action:o.action, date:o.date, rows:o.rows}))})
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || "rejected");
    ops.forEach(o => { if(o.action === "delete") delete cfg.synced[o.date]; else cfg.synced[o.date] = o.fp; });
    cfg.lastOk = Date.now(); cfg.lastErr = null;
  }catch(err){
    /* browsers don't normally put the URL in a fetch error, but don't rely on it */
    cfg.lastErr = scrub(String(err.message || err));
  }finally{
    syncing = null; done();
    save();
    if(ui.tab === "setup") render();
  }
}

let syncTimer = null;
function scheduleSync(){
  if(!syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => flushSync(false), 2000);   /* never blocks logging */
}

/* what is actually on disk right now — used to prove a delete stuck */
function storedSessions(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? (JSON.parse(raw).sessions || []) : [];
  }catch(e){ return null; }
}

/* ---------------- helpers ---------------- */
/* ---------------- programs ----------------
   A program is a training block: a split, its exercise lists, and the dates it
   ran. Nothing about progression, volume or history keys off it - those all key
   off the exercise, so starting a new block never resets your numbers. */
function activeProgram(){
  const list = S.programs || [];
  return list.find(x => x.id === S.activeProgram) || list[0] || null;
}
const activeDays = () => { const p = activeProgram(); return (p && p.days) || []; };
const dayEx = id => { const d = dayById[id]; return (d && d.ex) || []; };

/* A block cannot be deleted once anything has been logged under it, because
   its days carry the names and colours those sessions display. */
function programUsed(p){
  const ids = {};
  (p.days || []).forEach(d => ids[d.id] = 1);
  return S.sessions.some(x => (x.pg && x.pg === p.id) || (x.day && ids[x.day]));
}

function setActiveProgram(id){
  const prev = activeProgram();
  const next = (S.programs || []).find(x => x.id === id);
  if(!next) return;
  if(prev && prev.id !== next.id && !prev.ended) prev.ended = todayISO();
  next.ended = null;
  if(!next.started) next.started = todayISO();
  S.activeProgram = next.id;
  save(); render();
}

/* The five calendar colours a day can wear. Names are the colour, not the
   body part, because a day called "Push" has no business being "Upper". */
const DAY_KEYS = [
  {k:"U", n:"Green"}, {k:"L", n:"Blue"}, {k:"A", n:"Amber"},
  {k:"X", n:"Red"},   {k:"C", n:"Grey"},
];

/* A day cannot be removed once a session points at it - dayById is built from
   p.days, so removing it would strip that session's name and colour. */
const dayUsed = id => S.sessions.some(x => x.day === id);
const programOf = dayId =>
  (S.programs || []).find(p => (p.days || []).some(d => d.id === dayId)) || null;

function makeProgram(name, days){
  const p = {
    id: newId("pg"),
    n: name,
    days: days.map(d => ({id:newId("d"), n:d.n, key:d.key || "U", ex:(d.ex || []).slice()})),
    started: todayISO(),
    ended: null,
  };
  S.programs.push(p);
  setActiveProgram(p.id);
  return p;
}

/* New days get new ids on purpose: sessions from the old block keep pointing at
   the old block's days, so its history stays labelled after you move on. */
function duplicateProgram(srcId, name){
  const src = (S.programs || []).find(x => x.id === srcId);
  if(!src) return;
  S.programs.push({
    id: newId("pg"),
    n: name,
    days: src.days.map(d => ({id:newId("d"), n:d.n, key:d.key, ex:(d.ex || []).slice()})),
    started: todayISO(),
    ended: null,
  });
  const made = S.programs[S.programs.length-1];
  setActiveProgram(made.id);
  return made;
}

/* the phone's own calendar day. toISOString() is UTC and rolls over at 8pm here,
   which filed evening sessions under tomorrow. */
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                         + "-" + String(d.getDate()).padStart(2,"0");
};
function fmtDate(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString(undefined,
    {weekday:"short",month:"short",day:"numeric"});
}
function daysAgo(iso){
  return Math.round((new Date(todayISO()+"T12:00:00") - new Date(iso+"T12:00:00"))/86400000);
}
const sorted = () => [...S.sessions].sort((a,b) => a.date < b.date ? 1 : -1);
const currentSession = () => S.sessions.find(x => x.date === todayISO()) || null;

/* The session being logged into right now. Held by reference, because
   matching on date breaks the moment midnight passes mid-workout. */
/* true when the workout on screen began on an earlier calendar day */
function carriedOver(){

  return !!(s && s.date !== todayISO());

function workingSession(){

function dayKey(sess){
  if(sess.day && dayById[sess.day]) return dayById[sess.day].key;
  if(!sess.day) return "Q";
  const n = (sess.name || "").toLowerCase();
  if(n.startsWith("upper")) return "U";

const monthOf = iso => iso.slice(0,7);

/* the Sunday on or before a date — matches the S M T W T F S calendar grid */
function weekStart(iso){
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() - d.getDay());
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                         + "-" + String(d.getDate()).padStart(2,"0");
}
function weekEnd(iso){
  const d = new Date(weekStart(iso) + "T12:00:00");
  d.setDate(d.getDate() + 6);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                         + "-" + String(d.getDate()).padStart(2,"0");
}
const weekRangeLabel = () =>
  fmtDate(weekStart(todayISO())) + " – " + fmtDate(weekEnd(todayISO()));
function shiftMonth(ym, by){
  let [y,m] = ym.split("-").map(Number);
  m += by;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  return y + "-" + String(m).padStart(2,"0");
}

const effortBand = v => EFFORT_BANDS.findIndex(b => v >= b.lo && v <= b.hi);
const effortName = v => (EFFORT_BANDS[effortBand(v)] || {n:""}).n;
const effortChip = v => v
  ? ` <span class="eff-chip band${effortBand(v)}">${v} ${esc(effortName(v))}</span>` : "";

/* What you called it last time, for calibration - the hard part of any effort
   scale is being consistent with your own past self. Same date guards as
   progression(), so a session still being logged never counts as history. */
/* One short line saying what this rating does to tomorrow. Recomputed as you
   drag, so the scale teaches itself: watch the load jump vanish when you rate a
   session all out. */
function nextSessionLine(exId, effort){
  const s = workingSession();
  const e = s && s.entries.find(x => x.ex === exId);
  if(!e || !e.sets.length || isTime(exId)) return "";
  const p = progression(exId, {sets:e.sets, effort});
  if(p.state === "ready") return "Next session: " + loadPhrase(exId, p.load);
  if(p.state === "stall") return "Next session: flagged as stalled";
  if(p.state === "hold")
    return p.target
      ? "Next session: go for " + p.target.join(" and ")
      : "Next session: stay at " + loadPhrase(exId, p.load);
  return "";
}

function lastEffortLine(exId){
  const ws = workingSession();
  const prev = exHistory(exId).find(x =>
    x.effort && x.date !== todayISO() && !(ws && x.date === ws.date));
  return prev
    ? `<div class="eff-last">Last time you rated this ${prev.effort} \u00b7 `
      + esc(effortName(prev.effort)) + `</div>`

}

function effortPickerHTML(cur, label){

/* Repaint in place rather than re-rendering the sheet: deliberating between 7
   and 8 should not move anything under your thumb. */
function mountEffortPicker(cur, label, onPick){
  const host = document.querySelector(".eff");
  if(!host) return;
  host.outerHTML = effortPickerHTML(cur, label);
  document.querySelectorAll("[data-eff]").forEach(b =>
    b.onclick = () => onPick(+b.dataset.eff));
  wireEffortDrag(cur, onPick);
}

/* Slide a thumb along the row rather than hitting one 31px bar. The listeners
   live on document, not on the row, because onPick repaints the picker and
   would otherwise tear out the node mid-drag. The row's rect is measured once
   at pointerdown for the same reason. A plain tap is left to the button's own
   click handler - this only fires once you actually move. */
function wireEffortDrag(cur, onPick){
  const row = document.querySelector(".eff-bars");
  if(!row) return;
  row.addEventListener("pointerdown", ev => {
    const rect = row.getBoundingClientRect();
    let last = cur;
    const move = e => {
      e.preventDefault();
      const i = Math.floor((e.clientX - rect.left) / (rect.width / 10));
      const v = Math.max(1, Math.min(10, i + 1));
      if(v !== last){ last = v; onPick(v); }
    };
    const end = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", end);
      document.removeEventListener("pointercancel", end);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
  });
}

/* ten only */
function effortBloom(v){
  if(v !== 10) return;
  const card = document.querySelector(".sheet-card");
  if(!card) return;
  card.classList.remove("bloom");
  void card.offsetWidth;                 /* force a reflow so it can replay */
  card.classList.add("bloom");
  setTimeout(() => card.classList.remove("bloom"), 900);
}

/* progression: hold the load until the top of the range lands on two sets */
/* how a load reads in prose — "bodyweight", not "BW lb" */
function loadPhrase(exId, v){
  if(v === 0) return "bodyweight";
  const u = (exById[exId] && exById[exId].u) || "lb";
  return w(v) + "\u00a0" + u;   /* nbsp: never orphan the unit on its own line */
}
const repList = arr =>
  arr.length === 1 ? arr[0] + " reps"
  : arr.slice(0,-1).join(", ") + " and " + arr[arr.length-1] + " reps";

/* the two sets that count at a load: your best two. One set is not a scoreable
   session — a short day should never be able to look like a plateau. */
function scoreAt(sess, load){
  const at = sess.sets.filter(x => x.w === load);
  if(at.length < 2) return null;
  const best2 = [...at].sort((a,b) => b.r - a.r).slice(0,2);
  return {
    total: best2[0].r + best2[1].r,
    min:   best2[1].r,
    reps:  best2.map(x => x.r),          /* high, low — for the copy */
    order: at.slice(0,2).map(x => x.r),  /* as performed — set 1, set 2 */
  };
}
/* total first, then the weaker set: 10/8 beats 11/7 */
const beatsScore = (a,b) => !b || a.total > b.total || (a.total === b.total && a.min > b.min);

/* `assume` lets a caller ask a hypothetical: treat the session being logged
   right now as finished, with this effort, and say what you would advise next
   time. The effort picker uses it to show the consequence of the rating while
   you are still choosing it. One rule table, so the preview cannot disagree
   with what actually happens tomorrow. */
function progression(exId, assume){
  const def = defFor(exId), h = exHistory(exId);
  /* a session carried past midnight is dated yesterday but is still being logged
     into — scoring it as finished history would change the advice mid-workout */
  const ws = workingSession();
  const past = h.filter(s => s.date !== todayISO() && !(ws && s.date === ws.date));
  /* newest first, so the assumed session goes on the front */
  if(assume && assume.sets && assume.sets.length)
    past.unshift({date:todayISO(), sets:assume.sets, effort:assume.effort});

  if(isTime(exId)){
    return past.length
      ? {state:"time", load:null, lines:["Last time: " + past[0].sets.map(x => x.t + " min").join(", ") + "."]}
      : {state:"new", load:null, lines:["First one.", "Log the minutes when you're done."]};
  }
  if(!past.length){
    return {state:"new", load:null, lines:[
      "First time on this one.",
      "Pick a load you can manage for " + def.rl + " reps."]};
  }

  const last = past[0], load = last.sets[0].w;
  /* your best two sets at the working load — BOTH must reach the top of the range */
  const atLoad2 = last.sets.filter(x => x.w === load);
  const working = [...atLoad2].sort((a,b) => b.r - a.r).slice(0,2);
  const hits = working.filter(x => x.r >= def.rh).length;
  const shown = repList(atLoad2.map(x => x.r));   /* shown in the order you did them */

  /* How hard last session was, if it was rated at all. Every comparison here is
     written so an unrated session fails it - undefined >= 9 and undefined <= 3
     are both false - which is what lets the whole feature no-op against history
     logged before effort existed. That is all of it. */
  const E = last.effort;
  const allOut = E >= 9, easy = E <= 3;

  /* both promotion paths differ only in the reason they give */
  const moveUp = why => {
    const next = load + def.inc;
    return {state:"ready", load:next, lines:[
      "Move up to " + loadPhrase(exId, next) + " today.",
      why,
      "Reps reset. Work back up to " + def.rh + "."]};
  };

  if(working.length >= 2 && hits >= 2){
    /* the one place effort overrides double progression outright */
    if(allOut){
      return {state:"hold", load, lines:[
        "Stay at " + loadPhrase(exId, load) + " today.",
        "Both sets hit " + def.rh + ", but you rated it all out — load on top of that buries you.",
        "Own it at this weight first, then move up."]};
    }
    return moveUp("Your best two sets both hit " + def.rh + " reps last time — that's the trigger.");
  }

  /* One of two sets topped the range and it barely cost you: the load is the
     limit, not you. The two-set guard is not optional - a single logged set is
     not a scoreable session anywhere else in here, and without it one easy set
     at the top promoted the load on its own. */
  if(working.length >= 2 && hits === 1 && easy){
    return moveUp("You reached " + def.rh
      + " on a set and rated it easy — that's the load being too light.");
  }

  /* carry each session's effort onto its score, so the stall rule can read it */
  const scored = [];
  past.forEach(s => {
    const sc = scoreAt(s, load);
    if(sc){ sc.effort = s.effort; scored.push(sc); }
  });

  /* anchor on the FIRST session that hit the best, so 18 → 18 → 18 → 18 reads as
     three sessions without progress instead of resetting on every tie */
  let best = null, bestIdx = -1;
  for(let i = scored.length - 1; i >= 0; i--){
    if(beatsScore(scored[i], best)){ best = scored[i]; bestIdx = i; }
  }
  const since = bestIdx > 0 ? bestIdx : 0;

  /* set 2 catching up to set 1 is progress, even without a new best */
  const climbing = scored.length >= 2
    && scored[0].order[1] < scored[0].order[0]
    && scored[0].order[1] > scored[1].order[1];

  if(since >= 3 && !climbing){
    /* Three coasting sessions is not a plateau, and "drop 10%" would be exactly
       the wrong advice. One unrated session in the window fails the test and
       falls through to the normal message, which is the safe direction. */
    if(scored.slice(0, since).every(x => x.effort <= 3)){
      return {state:"stall", load, lines:[
        "No new best in " + since + " sessions at " + loadPhrase(exId, load)
          + " — and you rated every one easy.",
        "Best total: " + best.total + " reps (" + best.reps[0] + " + " + best.reps[1] + ").",
        "The weight isn't the problem. Take a set closer to failure."]};
    }
    return {state:"stall", load, lines:[
      "No new best in " + since + " sessions at " + loadPhrase(exId, load) + ".",
      "Best total: " + best.total + " reps (" + best.reps[0] + " + " + best.reps[1] + ").",
      "Swap it for today, or drop about 10% and rebuild."]};
  }

  /* Say what to do, not what already happened. One more rep on each of the counted
     sets from your best session here, capped at the top of the range. Anchored on
     the best rather than on last time, so hitting the target always registers as
     progress - a target that merely ties the best would read back as "no new best"
     the moment he hit it. */
  /* Normally one more rep on each counted set. After an all-out session that
     still fell short, ask for one on the weaker set only - a smaller step is
     the point of having rated it. */
  const target = !best ? null
    : (allOut && hits === 0
        ? [Math.min(best.reps[0], def.rh),
           Math.min(best.reps[1] + 1, def.rh)].sort((a,b) => b - a)
        : best.reps.map(r => Math.min(r + 1, def.rh)));

  let pace;
  if(target){
    pace = "Go for " + target.join(" and ")
         + (target.every(r => r >= def.rh) ? " — that moves the load up." : ".");
  } else if(working.length < 2){
    pace = "Log 2 sets at " + def.rl + "–" + def.rh + " reps.";
  } else {
    const gap = def.rh - Math.max(...working.map(x => x.r));
    pace = gap + (gap === 1 ? " rep" : " reps") + " to go on your best set.";
  }

  return {state:"hold", load, target, lines:[
    "Keep " + loadPhrase(exId, load) + " this session.",
    "Last time: " + shown + (best
      ? (since === 0
          ? " — your best at this load."          /* don't say the same numbers twice */
          : " — best here is " + best.total + " total (" + best.reps[0] + " + " + best.reps[1] + ").")
      : " — hit " + def.rh + " reps on your best two sets to move up."),
    pace]};
}

/* one renderer, so the logger and the history sheet can never disagree */
function hintHTML(p){
  return p.lines.map((t,i) =>
    `<div class="hint-line hint-${i===0?"lead":i===1?"body":"pace"} ${i===2?esc(p.state):""}">${esc(t)}</div>`
  ).join("");
}

function chipFor(exId){
  const p = progression(exId);
  return p.state === "ready" ? '<span class="chip ready">Add load</span>'
       : p.state === "stall" ? '<span class="chip stall">Stalled</span>'
       : p.state === "new"   ? '<span class="chip accent">New</span>' : "";
}

/* weekly volume — cardio excluded, it isn't a muscle */
/* Two numbers per muscle: sets where it was the point of the exercise, and sets
   where it only came along. Only the direct count is judged against the target
   band, which is why none of the 14 bands needed re-tuning when this landed. */
function weekVolume(){
  const out = {};
  MUSCLES.forEach(m => out[m.id] = {direct:0, sec:0});
  const wk = weekStart(todayISO());
  for(const s of S.sessions){
    if(weekStart(s.date) !== wk) continue;   /* resets on its own each Sunday */
    for(const e of s.entries){
      const def = exById[e.ex];
      if(!def) continue;
      const n = e.sets.length;
      if(out[def.m]) out[def.m].direct += n;
      (def.sec || []).forEach(mid => { if(out[mid]) out[mid].sec += n; });
    }
  }
  return out;
}

/* ---------------- rest timer ---------------- */
/* A plain setInterval countdown has two problems on a phone: it stops running the
   moment the screen locks, and nothing fires at zero. So the clock is a timestamp,
   which cannot be frozen or drift, and the alert is scheduled ahead on the Web
   Audio clock, which keeps running when JS does not.
   Sound is the only alert available here: iOS Safari has no Vibration API at all,
   so navigator.vibrate is a no-op on an iPhone. */
let restT = null, restEnd = 0, restChimed = false;

/* Settled on the device, so nobody has to guess at it again.
   Three mechanisms were tried against the iOS mute switch and all three lost:
   Web Audio tones, an <audio> element, and an <audio> element with the audio
   session claimed as "playback". Ringer on, the clip plays over music without
   interrupting it. Ringer off, nothing makes a sound, and claiming "playback"
   merely kills the music without producing a tone.
   Conclusion: a web app cannot make noise on a muted iPhone. The only untried
   route is a <video> element, which would mean bundling an encoded video file
   into this one-file app - not worth it on a fourth guess.
   So: play the clip plainly, never claim an audio session, and let the visual
   carry the timer, because his ringer is normally off. */

let chimeEl = null;

/* The chime, rendered once into a real WAV. Built in code rather than embedded as
   base64 so the app stays one small self-contained file. */
function buildChimeURL(){
  const rate = 44100, n = Math.floor(rate * 0.36);
  const buf = new Float32Array(n);
  const tone = (startS, hz, lenS) => {
    const s0 = Math.floor(startS * rate), len = Math.floor(lenS * rate);
    for(let i = 0; i < len && s0 + i < n; i++){
      const t = i / rate;
      const env = Math.min(1, t / 0.008) * Math.exp(-t * 20);   /* quick attack, soft tail */
      buf[s0 + i] += Math.sin(2 * Math.PI * hz * t) * env * 0.55;
    }
  };
  tone(0,    880,  0.17);
  tone(0.16, 1175, 0.19);

  const bytes = new ArrayBuffer(44 + n * 2);
  const dv = new DataView(bytes);
  const str = (off, v) => { for(let k = 0; k < v.length; k++) dv.setUint8(off + k, v.charCodeAt(k)); };
  str(0, "RIFF");  dv.setUint32(4, 36 + n * 2, true);   str(8, "WAVE");
  str(12, "fmt "); dv.setUint32(16, 16, true);          dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true);                            dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * 2, true);                     dv.setUint16(32, 2, true);
  dv.setUint16(34, 16, true);
  str(36, "data"); dv.setUint32(40, n * 2, true);
  for(let i = 0; i < n; i++){
    const v = Math.max(-1, Math.min(1, buf[i]));
    dv.setInt16(44 + i * 2, v * 32767, true);
  }
  return URL.createObjectURL(new Blob([bytes], {type:"audio/wav"}));
}

function chimeElement(){
  if(!chimeEl){
    chimeEl = new Audio(buildChimeURL());
    chimeEl.preload = "auto";
  }
  return chimeEl;
}

/* Must run inside a real tap. iOS will not let a media element play later on a
   timer unless it has been played once from a gesture, so prime it muted. */
function unlockAudio(){
  try{
    const el = chimeElement();
    el.muted = true;
    const p = el.play();
    const done = () => { try{ el.pause(); el.currentTime = 0; el.muted = false; }catch(e){} };
    if(p && p.then) p.then(done).catch(() => { el.muted = false; });
    else done();
  }catch(e){}
}

function chimeNow(){
  try{
    const el = chimeElement();
    el.currentTime = 0;
    const p = el.play();
    if(p && p.catch) p.catch(() => {});
    return true;
  }catch(e){ return false; }
}

const REST_KEY = "ironledger.rest";

/* The end time has to outlive the page. iOS evicts a backgrounded PWA and reloads
   it from scratch - that is the cold start he was seeing - and restEnd lived only
   in memory, so a rest begun before switching apps came back as no timer at all.
   Kept in its own key rather than in S, so a rest never drags the Sheet sync along. */
function saveRestEnd(){
  try{
    if(restEnd > Date.now()) localStorage.setItem(REST_KEY, String(restEnd));
    else localStorage.removeItem(REST_KEY);
  }catch(e){}
}
function restoreRest(){
  try{
    const v = Number(localStorage.getItem(REST_KEY) || 0);
    if(!v) return;
    const over = Date.now() - v;
    if(over > 600000){ localStorage.removeItem(REST_KEY); return; }  /* long gone */
    restEnd = v;
    restChimed = over > 0;        /* already finished while away - no late chime */
    document.getElementById("rest").classList.remove("hidden");
    paintRest();
    if(restLeft() > 0 && !restT) restT = setInterval(paintRest, 250);
  }catch(e){}
}

const restLeft = () => Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));

function startRest(){
  unlockAudio();                        /* runs straight off the Log set tap */
  restEnd = Date.now() + S.restLen * 1000;
  restChimed = false;
  saveRestEnd();
  document.getElementById("rest").classList.remove("hidden","done");
  paintRest();
  clearInterval(restT);
  restT = setInterval(paintRest, 250);  /* repaint only - restEnd is the clock */
}

function paintRest(){
  const el = document.getElementById("restTime");
  if(!el) return;
  const left = restLeft();
  const m = Math.floor(left/60), s = left % 60;
  el.textContent = left <= 0 ? "GO" : m + ":" + String(s).padStart(2,"0");
  if(left <= 0){
    document.getElementById("rest").classList.add("done");
    clearInterval(restT); restT = null;
    if(!restChimed){
      restChimed = true;
      /* don't sound off for a rest that quietly ended several minutes ago */
      if(Date.now() - restEnd < 5000){
        chimeNow();
        if(navigator.vibrate) navigator.vibrate([120,80,120]);   /* no-op on iOS */
      }
    }
  }
}

/* Coming back from a locked screen: the interval was throttled or killed, so
   repaint from the timestamp and pick the ticking back up. */
function resumeRest(){
  const host = document.getElementById("rest");
  if(!host || host.classList.contains("hidden")) return;
  paintRest();
  if(restLeft() > 0 && !restT) restT = setInterval(paintRest, 250);
}

function stopRest(){
  clearInterval(restT); restT = null;
  restEnd = 0; saveRestEnd();
  document.getElementById("rest").classList.add("hidden");
}
document.getElementById("restStop").onclick = stopRest;
document.getElementById("restAdd").onclick = () => {
  restEnd = Math.max(restEnd, Date.now()) + 30000;
  restChimed = false;
  saveRestEnd();
  document.getElementById("rest").classList.remove("done");
  if(!restT) restT = setInterval(paintRest, 250);
  paintRest();
};

/* ---------------- theme ---------------- */
function applyTheme(){
  const r = document.documentElement;
  if(S.theme === "system") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme", S.theme);
  const dark = S.theme === "dark" ||
    (S.theme === "system" && matchMedia("(prefers-color-scheme:dark)").matches);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", dark ? "#101208" : "#F7F8F4");
}

/* ======================================================================
   VIEWS
   ====================================================================== */
function render(){
  const v = document.getElementById("view");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === ui.tab));
  const s = workingSession();
  const sets = s ? s.entries.reduce((a,e) => a + e.sets.length, 0) : 0;
  document.getElementById("topMeta").textContent =
    (s && s.day) ? sessName(s).toUpperCase() + " · " + sets + " SET" + (sets===1?"":"S")
    : (s && sets) ? fmtDate(todayISO()).toUpperCase() + " · " + sets + " SET" + (sets===1?"":"S")
    : fmtDate(todayISO()).toUpperCase();

  if(ui.tab === "today")   v.innerHTML = viewToday();
  if(ui.tab === "volume")  v.innerHTML = viewVolume();
  if(ui.tab === "history") v.innerHTML = viewHistory();
  if(ui.tab === "setup")   v.innerHTML = viewSetup();
  wire();
}

/* ---------- TRAIN ---------- */
function viewToday(){
  const s = workingSession();

  /* 1. nothing committed yet — greeting + day tiles.
        An empty, dayless session left over from tapping the catalogue
        must not swallow the greeting. */
  if(!s || (!s.day && !hasSets(s) && !ui.openEx)){
    const last = sorted().find(x => x.date !== todayISO() && hasSets(x));
    return `
      <div class="eyebrow">v${BUILD}</div>
      <div>
        <div class="hello">Hey ${esc(S.name)},<br><em>what are we working on today?</em></div>
        ${last ? `<div class="hello-sub">Last up was ${esc(sessName(last))}, ${daysAgo(last.date)} day${daysAgo(last.date)===1?"":"s"} ago.</div>` : ""}
      </div>
      ${activeDays().length ? `<div class="tiles">
        ${activeDays().map(d => `<button class="tile" data-day="${d.id}">
            <b>${esc(d.n)}</b>
            <small>${dayEx(d.id).length} exercises</small>
          </button>`).join("")}
      </div>` : `<div class="card pad">
        <div class="note" style="font-size:14px;line-height:1.5">
          <b>${esc((activeProgram() || {n:"This program"}).n)}</b> has no days yet.
          Add one in Setup, or pick any exercise below to log without a day.</div>
      </div>
      <div class="tiles"><button class="tile wide add" data-openall="1">
        <b>+ Something else</b><small>full catalogue</small></button></div>`}`;
  }

  /* 2. an exercise is open — grid hidden, logger only */
  if(ui.openEx){
    const e = s.entries.find(x => x.ex === ui.openEx);
    if(e) return loggerCard(e);
    ui.openEx = null;
  }

  /* 3. between exercises — the day's grid */
  const doneIds = s.entries.filter(e => e.sets.length).map(e => e.ex);
  const plan = (s.plan && s.plan.length ? s.plan : dayEx(s.day))
                 .filter(id => exById[id]);
  const extras = doneIds.filter(id => !plan.includes(id));
  const total = s.entries.reduce((a,e) => a + e.sets.length, 0);

  const tile = id => {
    const def = exById[id], done = doneIds.includes(id);
    const prev = exHistory(id).filter(x => x.date !== todayISO())[0];
    return `<button class="tile ${done?"done":""}" data-pick="${id}">
      <b>${esc(def.n)}</b>
      <small>${esc(muscleById[def.m].n)}</small>
      ${prev ? setPills(id, prev.sets.slice(0,3)) : ""}
      <div class="tile-chip">${chipFor(id)}</div>
    </button>`;
  };

  const carried = carriedOver();
  const header = s.day
    ? `${total === 0 ? `<button class="btn" data-back="1"
           style="min-height:42px;font-size:13.5px;align-self:flex-start">← Back</button>` : ""}
       <div class="eyebrow">${esc(sessName(s))} · ${total} set${total===1?"":"s"}</div>
       ${carried ? `<div class="lock-note">Started ${fmtDate(s.date)} — finish or end it to start today.</div>` : ""}`
    : `<div class="eyebrow">${fmtDate(s.date)} · ${total} set${total===1?"":"s"}</div>
       <div class="card pad" style="display:flex;flex-direction:column;gap:9px">
         <div class="note" style="font-size:14px">What kind of day is this? Nothing is labelled until you say.</div>
         <div class="seg">
           ${activeDays().map(d => `<button data-setday="${d.id}">${esc(d.n)}</button>`).join("")}
         </div>
       </div>`;

  return `
    ${header}
    <div class="tiles">
      ${plan.map(tile).join("")}
      ${extras.map(tile).join("")}
      <button class="tile wide add" data-openall="1">
        <b>+ Something else</b><small style="margin-left:auto">full catalogue</small>
      </button>
    </div>
    <div class="note" style="font-size:12.5px;color:var(--faint);text-align:center">
      Machine taken? Long-press a tile — or open it and tap Swap. Just for today.
    </div>
    <div class="btn-row">
      <button class="btn" data-end="1">End session</button>
      <button class="btn danger" data-discard="1">Discard session</button>
    </div>`;
}

function loggerCard(e){
  const def = defFor(e.ex);
  const p = progression(e.ex);
  const time = isTime(e.ex);
  const sets = e.sets.map((x,i) =>
    `<span class="setpill ${ui.freshSet && i === e.sets.length-1 ? "fresh" : ""}"
       data-del="${e.ex}:${i}">${setLabel(e.ex, x)}</span>`).join("");
  ui.freshSet = false;

  const suggestW = e.sets.length ? e.sets[e.sets.length-1].w
                 : (p.load != null ? p.load : (def.bw ? 0 : 20));
  const lastMin = e.sets.length ? e.sets[e.sets.length-1].t : 30;

  const controls = time ? `
      <div class="step-group">
        <div class="step-label">Minutes</div>
        <div class="step-ctl">
          <button data-nudge="t:-" aria-label="fewer minutes">−</button>
          <input id="inT" type="number" inputmode="numeric" step="5" value="${lastMin}">
          <button data-nudge="t:+" aria-label="more minutes">+</button>
        </div>
      </div>` : `
      <div class="step-group">
        <div class="step-label">Weight (${def.u})</div>
        <div class="step-ctl">
          <button data-nudge="w:-" aria-label="less weight"
            ${suggestW <= 0 ? 'class="atfloor"' : ""}>−</button>
          <input id="inW" type="text" inputmode="decimal" autocomplete="off"
            spellcheck="false" value="${w(suggestW)}">
          <button data-nudge="w:+" aria-label="more weight">+</button>
        </div>
      </div>
      <div class="step-group">
        <div class="step-label">Reps</div>
        <div class="step-ctl">
          <button data-nudge="r:-" aria-label="fewer reps">−</button>
          <input id="inR" type="number" inputmode="numeric" step="1" value="${def.rl}">
          <button data-nudge="r:+" aria-label="more reps">+</button>
        </div>
      </div>`;

  return `
    <div class="card logger">
      <div>
        <div class="log-name">${esc(def.n)}</div>
        <div class="log-meta">${esc(muscleById[def.m].n)}${time ? "" : " · target " + def.rl + "–" + def.rh + " reps"}</div>
      </div>
      ${carriedOver() ? `<div class="lock-note">Started ${fmtDate(workingSession().date)} — still logging to that session.</div>` : ""}
      <div class="target">${hintHTML(p)}${def.note ? `<div class="hint-line hint-note">${esc(def.note)}</div>` : ""}</div>
      ${sets ? `<div class="setline">${sets}</div>` : ""}
      <div class="stepper">${controls}</div>
      <button class="btn btn-primary btn-wide" id="logBtn" data-logset="${e.ex}">
        ${time ? "Log it · finish" : "Log set · start rest"}</button>
      <button class="btn btn-wide" data-next="${e.ex}">Next exercise</button>
      <div class="btn-row">
        <button class="btn" data-histsheet="${e.ex}">History</button>
        <button class="btn" data-swap="${e.ex}">Swap</button>
        <button class="btn" data-rmex="${e.ex}">Remove</button>
      </div>
    </div>`;
}

/* ---------- VOLUME ---------- */
function viewVolume(){
  const vol = weekVolume();
  const rows = MUSCLES.map(m => {
    const d = vol[m.id].direct, sc = vol[m.id].sec;
    const t = targetFor(m.id);
    /* room for the target band, and for whatever the bar actually adds up to */
    const scale = Math.max(t.hi * 1.5, d + sc, 1);
    const cls = d < t.lo ? "low" : d > t.hi ? "high" : "";   /* direct only */
    return `<button class="vol-row" data-muscle="${m.id}">
      <span class="vol-name">${esc(m.n)}<small>target ${t.lo}–${t.hi}</small></span>
      <span class="vol-track">
        <span class="vol-zone" style="left:${(t.lo/scale)*100}%;width:${((t.hi-t.lo)/scale)*100}%"></span>
        <span class="vol-bars">
          <span class="vol-fill ${cls}" style="width:${(d/scale)*100}%"></span>
          ${sc ? `<span class="vol-sec" style="width:${(sc/scale)*100}%"></span>` : ""}
        </span>
      </span>
      <span class="vol-num ${cls}">${d}${sc ? `<small>+${sc}</small>` : ""}</span>
    </button>`;
  }).join("");

  const under = MUSCLES.filter(m => vol[m.id].direct < targetFor(m.id).lo).map(m => m.n);
  const over  = MUSCLES.filter(m => vol[m.id].direct > targetFor(m.id).hi).map(m => m.n);

  return `
    <div class="eyebrow">This week · ${esc(weekRangeLabel())}</div>
    <div class="card vol">${rows}</div>
    <div class="note" style="font-size:12.5px;color:var(--faint);text-align:center">
      Tap a muscle to see what built that bar.
    </div>
    <div class="card pad">
      <h3 class="sec">Read</h3>

function calendarView(){
  const ym = ui.calMonth || monthOf(todayISO());
  const [y,m] = ym.split("-").map(Number);
  const first = new Date(y, m-1, 1), days = new Date(y, m, 0).getDate();
  const byDate = {}; S.sessions.forEach(x => byDate[x.date] = x);

  let cells = "";
  for(let i=0;i<first.getDay();i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const iso = ym + "-" + String(d).padStart(2,"0"), sess = byDate[iso];
    const k = sess ? dayKey(sess) : "";
    const cls = ["cal-cell", sess ? k : "off",
                 iso === todayISO() ? "today" : "",
                 iso === ui.calDay ? "sel" : ""].join(" ");
    cells += sess
      ? `<button class="${cls}" data-calday="${iso}">
           <div class="d">${d}</div><div class="k">${k === "X" ? "AB" : k}</div></button>`
      : `<button class="${cls}" data-calday="${iso}"><div class="d">${d}</div></button>`;
  }

  const sel = ui.calDay ? byDate[ui.calDay] : null;
  const count = S.sessions.filter(x => monthOf(x.date) === ym).length;
  return `
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" data-cal="-1" aria-label="previous month">‹</button>
        <div class="cal-title">${esc(first.toLocaleDateString(undefined,{month:"long",year:"numeric"}))}</div>
        <button class="cal-nav" data-cal="1" aria-label="next month">›</button>
      </div>
      <div class="cal-grid">
        ${["S","M","T","W","T","F","S"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
        ${cells}
      </div>
      <div class="cal-key">${legendKeys(ym)}</div>
    </div>
    <div class="eyebrow">${count} session${count===1?"":"s"} this month</div>
    ${sel ? sessionCard(sel) : `<div class="card pad"><div class="note" style="color:var(--muted)">Tap a day to see what you did.</div></div>`}`;
}

/* The legend used to be five hardcoded labels, which stopped being true the
   moment a day could be renamed. Built from the days actually on screen. */
function legendKeys(ym){
  const seen = {};
  const add = (key, n) => {
    const list = seen[key] = seen[key] || [];
    if(!list.includes(n)) list.push(n);
  };
  /* what is actually on the grid this month */
  S.sessions.filter(x => monthOf(x.date) === ym).forEach(x => {
    const d = dayById[x.day];
    add(d ? d.key : dayKey(x), d ? d.n : (sessName(x) || "Unlabelled"));
  });
  /* then what you could log next, for keys the month has not used */
  activeDays().forEach(d => { if(!seen[d.key]) add(d.key, d.n); });
  return DAY_KEYS.filter(k => seen[k.k]).map(k =>
    `<span class="${k.k}">${esc(k.k + " · " + seen[k.k].slice(0,2).join(", "))}</span>`).join("");
}

function sessionCard(x){
  return `<div class="card"><div class="hist-item">
    <div class="hist-date">${fmtDate(x.date).toUpperCase()} · ${x.entries.reduce((a,e)=>a+e.sets.length,0)} sets</div>
    <div class="hist-title">${esc(sessName(x))}</div>
    <div class="hist-body">
      ${x.entries.map(e => `<div class="hist-line">
        <span class="n">${esc((exById[e.ex]||{n:e.ex}).n)}${effortChip(e.effort)}</span>
        ${setPills(e.ex, e.sets, true)}
      </div>`).join("")}
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn" data-editsess="${x.date}"
        style="min-height:44px;font-size:14px">Edit sets</button>
      <button class="btn danger" data-delsess="${x.date}"
        style="min-height:44px;font-size:14px">Delete session</button>

}

function listView(){
  const list = sorted();
  return `

/* ======================================================================
   SHEETS
   ====================================================================== */
function sheet(title, body, hero, opts){
  const o = opts || {};
  const dismiss = o.onDismiss || closeSheet;
  document.getElementById("sheetHost").innerHTML = `
    <div class="sheet" id="sheet">
      <div class="sheet-card">
        <div class="sheet-head">
          <div class="sheet-title">${esc(title)}</div>
          <button class="btn" style="margin-left:auto" data-closesheet="1">${esc(o.dismissLabel || "Close")}</button>
        </div>
        ${hero || ""}${body}
      </div>
    </div>`;
  document.getElementById("sheet").addEventListener("click", ev => {
    if(ev.target.id === "sheet") dismiss();
  });
  document.querySelector("[data-closesheet]").onclick = dismiss;
}
function closeSheet(){ document.getElementById("sheetHost").innerHTML = ""; }

/* History without leaving the workout. A sheet overlays the current view, so
   the logger underneath keeps its scroll position and its open exercise. */
function openHistorySheet(exId){
  const def = defFor(exId);
  const body = `<div class="wrap">
      ${exHistoryBody(exId)}
      <button class="btn btn-wide" data-histgoals="${exId}">Edit goals</button>
    </div>`;
  sheet(def.n, body, `<div class="queue-hero">
      <div class="kicker">${esc(muscleById[def.m].n)}${goalsEdited(exId) ? " · custom" : ""}</div>
      <div class="line">${isTime(exId) ? "Logged in minutes."
        : "Target " + def.rl + "–" + def.rh + " reps."}</div></div>`);
  document.querySelector("[data-histgoals]").onclick = () => openGoalsSheet(exId);
}

/* Sandboxed frames (the hosted version) silently refuse window.confirm/alert,
   so every confirmation runs through our own sheet instead. */
function askConfirm(o){
  const body = `<div style="padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-wide ${o.danger ? "danger" : "btn-primary"}" data-yes="1"
        style="min-height:52px">${esc(o.yes || "Confirm")}</button>
      <button class="btn btn-wide" data-no="1">Cancel</button>
    </div>`;
  /* onNo lets a caller that opened this from its own sheet put that sheet back,
     instead of a cancel dumping you all the way out to the app */
  const back = () => { closeSheet(); if(o.onNo) o.onNo(); };
  sheet(o.title, body, `<div class="queue-hero">
      <div class="kicker">${esc(o.kicker || "")}</div>
      <div class="line">${esc(o.line || "")}</div></div>`, {onDismiss:back});
  document.querySelector("[data-yes]").onclick = () => { closeSheet(); o.onYes(); };
  document.querySelector("[data-no]").onclick = back;
}

/* a delete that only happened in memory is worse than one that failed loudly */
function verifyGone(date){
  const stored = storedSessions();
  if(stored === null){
    notice("Couldn't save", "This device is blocking storage, so the change won't survive a reload.");
    return;
  }
  if(stored.some(x => x.date === date)){
    notice("Delete didn't stick", "The session is still in storage. Try again, and if it keeps coming back, copy your backup from Setup and tell me.");
  }
}

function notice(title, line){
  const body = `<div style="padding:6px 16px 16px">
      <button class="btn btn-primary btn-wide" data-no="1">OK</button></div>`;
  sheet(title, body, `<div class="queue-hero"><div class="line">${esc(line)}</div></div>`);
  document.querySelector("[data-no]").onclick = closeSheet;
}

/* ---------- PROGRAMS ---------- */
function programMeta(p){
  if(p.id === S.activeProgram) return p.started ? " · since " + fmtDate(p.started) : "";
  if(p.started && p.ended)     return " · " + fmtDate(p.started) + " – " + fmtDate(p.ended);
  if(p.ended)                  return " · ended " + fmtDate(p.ended);
  return " · not run yet";
}

/* The program sheet IS the day list - tap a program, see the days you made. */
function openProgramSheet(pgId){
  const p = (S.programs || []).find(x => x.id === pgId);
  if(!p) return;
  const active = p.id === S.activeProgram;
  const used = programUsed(p);
  const last = (S.programs || []).length < 2;

  const rows = p.days.map((d,i) => `<div class="tpl-row">
      <button class="day-open" data-dayopen="${d.id}">
        <span class="day-key ${d.key}">${esc(d.key)}</span>
